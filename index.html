<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>Investment Cockpit</title>

<style>
:root{
  --bg:#0b0d12;
  --card:#141821;
  --card2:#10131a;
  --border:#252b36;
  --text:#f2f4f7;
  --muted:#8992a3;
  --green:#35d07f;
  --red:#ff5c67;
  --yellow:#f5c451;
  --blue:#55a7ff;
  --purple:#a88cff;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

main{
  max-width:900px;
  margin:auto;
  padding:18px 14px 50px;
}

h1{margin:4px 0;font-size:26px}
h2{margin:0;font-size:18px}
h3{margin:0}

.small{
  color:var(--muted);
  font-size:13px;
  line-height:1.4;
}

.search{
  display:flex;
  gap:8px;
  margin:18px 0 12px;
}

input{
  flex:1;
  min-width:0;
  background:var(--card);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:10px;
  padding:13px;
  font-size:16px;
}

button{
  background:#1d2430;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px 16px;
  font-size:15px;
  font-weight:600;
}

button:active{transform:scale(.98)}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:16px;
  margin-top:12px;
}

.hero{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}

.price{
  font-size:31px;
  font-weight:750;
  margin-top:4px;
}

.change{
  font-size:14px;
  margin-top:3px;
}

.badge{
  padding:7px 10px;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}

.bullish{
  background:rgba(53,208,127,.15);
  color:var(--green);
}

.bearish{
  background:rgba(255,92,103,.15);
  color:var(--red);
}

.sideways{
  background:rgba(245,196,81,.15);
  color:var(--yellow);
}

.neutral{
  background:rgba(137,146,163,.15);
  color:var(--muted);
}

.blue{
  background:rgba(85,167,255,.15);
  color:var(--blue);
}

.purple{
  background:rgba(168,140,255,.15);
  color:var(--purple);
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-top:14px;
}

.stat{
  background:var(--card2);
  border-radius:10px;
  padding:11px;
}

.stat .label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:4px;
}

.stat .value{
  font-size:15px;
  font-weight:650;
  word-break:break-word;
}

.watchlist{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.tickerBtn{
  padding:9px 12px;
  font-size:13px;
}

.chartWrap{
  width:100%;
  overflow:hidden;
}

canvas{
  display:block;
  width:100%;
  height:auto;
  background:#0e1117;
  border-radius:10px;
}

.chartTitle{
  margin:4px 0 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.analysis{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.analysisBox{
  background:var(--card2);
  border-radius:10px;
  padding:12px;
}

.analysisBox h3{
  margin:0 0 7px;
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
}

.analysisBox strong{
  font-size:16px;
}

/* =========================
   DECISION COCKPIT
========================= */

.decision{
  border-color:#344052;
  background:
    linear-gradient(
      180deg,
      rgba(85,167,255,.07),
      rgba(20,24,33,1) 32%
    );
}

.decisionHeader{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.setup{
  font-size:21px;
  font-weight:800;
  margin-top:4px;
}

.triggerStatus{
  padding:8px 11px;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}

.triggerConfirmed{
  color:var(--green);
  background:rgba(53,208,127,.15);
}

.triggerWaiting{
  color:var(--yellow);
  background:rgba(245,196,81,.15);
}

.triggerDanger{
  color:var(--red);
  background:rgba(255,92,103,.15);
}

.decisionGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-top:14px;
}

.decisionBox{
  background:var(--card2);
  border-radius:11px;
  padding:12px;
}

.decisionBox .label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:5px;
}

.decisionBox .value{
  font-size:17px;
  font-weight:750;
}

.triggerBox{
  border:1px solid rgba(53,208,127,.28);
  background:rgba(53,208,127,.06);
}

.invalidationBox{
  border:1px solid rgba(255,92,103,.25);
  background:rgba(255,92,103,.05);
}

.rrBox{
  border:1px solid rgba(85,167,255,.25);
  background:rgba(85,167,255,.05);
}

.reasonBox{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  background:var(--card2);
}

.reasonBox .label{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  margin-bottom:5px;
}

.reasonBox .text{
  font-size:13px;
  line-height:1.45;
}

.quality{
  display:inline-block;
  padding:5px 8px;
  border-radius:7px;
  font-size:11px;
  font-weight:800;
}

.qualityGood{
  color:var(--green);
  background:rgba(53,208,127,.15);
}

.qualityOkay{
  color:var(--yellow);
  background:rgba(245,196,81,.15);
}

.qualityBad{
  color:var(--red);
  background:rgba(255,92,103,.15);
}

.conditions{
  margin-top:14px;
}

.conditionsTitle{
  font-size:12px;
  font-weight:750;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:8px;
}

.condition{
  display:flex;
  align-items:flex-start;
  gap:9px;
  padding:9px 10px;
  margin:6px 0;
  background:var(--card2);
  border-radius:9px;
  font-size:13px;
  line-height:1.35;
}

.conditionIcon{
  width:20px;
  height:20px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex:0 0 20px;
  font-size:12px;
  font-weight:800;
}

.conditionMet .conditionIcon{
  color:var(--green);
  background:rgba(53,208,127,.15);
}

.conditionMissing .conditionIcon{
  color:var(--red);
  background:rgba(255,92,103,.15);
}

/* =========================
   PULLBACK STRATEGY
========================= */

.pullback{
  border-color:rgba(53,208,127,.30);
  background:
    linear-gradient(
      180deg,
      rgba(53,208,127,.055),
      rgba(20,24,33,1) 35%
    );
}

.strategyTag{
  display:inline-block;
  padding:6px 9px;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.3px;
  margin-bottom:7px;
}

.pullbackTag{
  color:var(--green);
  background:rgba(53,208,127,.13);
}

.pullbackTitle{
  font-size:21px;
  font-weight:800;
}

.pullbackStatus{
  display:inline-block;
  margin-top:5px;
  padding:7px 10px;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
}

.pullbackGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-top:14px;
}

.pullbackBox{
  background:var(--card2);
  border-radius:11px;
  padding:12px;
}

.pullbackBox .label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:5px;
}

.pullbackBox .value{
  font-size:17px;
  font-weight:750;
}

.entryBox{
  border:1px solid rgba(53,208,127,.3);
  background:rgba(53,208,127,.055);
}

.pullbackExplanation{
  margin-top:12px;
  background:var(--card2);
  padding:12px;
  border-radius:10px;
  font-size:13px;
  line-height:1.45;
}

/* =========================
   FOOTER
========================= */

.footer{
  text-align:center;
  margin-top:22px;
}

@media(max-width:520px){

  main{
    padding:14px 10px 40px;
  }

  .analysis{
    grid-template-columns:1fr;
  }

  .decisionGrid,
  .pullbackGrid{
    grid-template-columns:1fr 1fr;
  }

  .decisionHeader{
    flex-direction:column;
  }

  .triggerStatus{
    align-self:flex-start;
  }

  .setup,
  .pullbackTitle{
    font-size:18px;
  }
}
</style>
</head>

<body>

<main>

<header>
  <h1>Investment Cockpit</h1>
  <div class="small">
    Technical trend, candlestick &amp; decision analysis
  </div>
</header>

<div class="search">
  <input
    id="ticker"
    placeholder="Enter ticker e.g. NVDA"
    autocomplete="off"
    autocapitalize="characters"
  >
  <button onclick="addTicker()">Add</button>
</div>

<div id="status" class="small"></div>

<div class="card">
  <div class="chartTitle">
    <h2>My watchlist</h2>
  </div>

  <div id="watchlist" class="watchlist"></div>
</div>

<div id="dashboard"></div>

<div class="footer small">
  Market data provided through Alpha Vantage.
</div>

</main>

<script>

const STORAGE_KEY = "ic_watchlist";
const SELECTED_KEY = "ic_selected";

let list = JSON.parse(
  localStorage.getItem(STORAGE_KEY) ||
  '["NVDA","MSFT","GOOGL","AAPL","AMZN","TSLA"]'
);

let selected =
  localStorage.getItem(SELECTED_KEY) || list[0];

let lastStockData = null;


/* =========================
   HELPERS
========================= */

function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(list)
  );

  localStorage.setItem(
    SELECTED_KEY,
    selected
  );
}


function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}


function money(value){

  if(
    value == null ||
    !Number.isFinite(Number(value))
  ){
    return "—";
  }

  return "$" +
    Number(value).toLocaleString(
      "en-US",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );
}


function number(value){

  if(
    value == null ||
    !Number.isFinite(Number(value))
  ){
    return "—";
  }

  return Number(value).toFixed(2);
}


function pct(value){

  const n = Number(value);

  if(!Number.isFinite(n))
    return "—";

  return (
    n >= 0 ? "+" : ""
  ) + n.toFixed(2) + "%";
}


function trendClass(trend){

  if(trend === "BULLISH")
    return "bullish";

  if(trend === "BEARISH")
    return "bearish";

  return "sideways";
}


function setupClass(setup){

  const s =
    String(setup || "").toUpperCase();

  if(
    s.includes("BREAKOUT") ||
    s.includes("CONFIRMED BUY") ||
    s.includes("BUY")
  )
    return "bullish";

  if(
    s.includes("BREAKDOWN") ||
    s.includes("CONFIRMED SELL") ||
    s.includes("SELL")
  )
    return "bearish";

  return "sideways";
}


function qualityClass(quality){

  const q =
    String(quality || "").toUpperCase();

  if(q === "ATTRACTIVE")
    return "qualityGood";

  if(q === "ACCEPTABLE")
    return "qualityOkay";

  return "qualityBad";
}


/* =========================
   WATCHLIST
========================= */

function renderWatchlist(){

  const box =
    document.getElementById("watchlist");

  box.innerHTML =
    list.map(t => `

      <button
        class="tickerBtn"
        onclick="selectTicker('${esc(t)}')"
      >
        ${esc(t)}
      </button>

    `).join("");
}


function addTicker(){

  const input =
    document.getElementById("ticker");

  const ticker =
    input.value
      .trim()
      .toUpperCase();

  if(!/^[A-Z.]{1,8}$/.test(ticker)){

    setStatus(
      "Enter a valid US ticker."
    );

    return;
  }

  if(!list.includes(ticker)){

    list.unshift(ticker);

    list = list.slice(0,12);
  }

  selected = ticker;

  save();

  input.value = "";

  renderWatchlist();

  load();
}


function selectTicker(ticker){

  selected = ticker;

  save();

  load();
}


function setStatus(text){

  document.getElementById(
    "status"
  ).textContent = text;
}


/* =========================
   API
========================= */

async function api(ticker){

  const response =
    await fetch(
      "/api/stock?ticker=" +
      encodeURIComponent(ticker)
    );

  const data =
    await response.json();

  if(!response.ok){

    throw new Error(
      data.error ||
      "Unable to load stock"
    );
  }

  return data;
}


/* =========================
   PRICE CHART
========================= */

function drawPriceChart(
  canvas,
  data
){

  const history =
    (data.history || [])
      .slice(-100);

  if(!history.length)
    return;

  const dpr =
    window.devicePixelRatio || 1;

  const width =
    canvas.clientWidth || 700;

  const height = 350;

  canvas.width = width*dpr;
  canvas.height = height*dpr;

  const ctx =
    canvas.getContext("2d");

  ctx.scale(dpr,dpr);

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  const pad = {
    left:48,
    right:12,
    top:18,
    bottom:28
  };

  const chartW =
    width-pad.left-pad.right;

  const chartH =
    height-pad.top-pad.bottom;

  const values = [];

  history.forEach(item => {

    [
      item.high,
      item.low,
      item.sma20,
      item.sma50
    ].forEach(v => {

      if(Number.isFinite(Number(v)))
        values.push(Number(v));

    });

  });

  [
    data.target1,
    data.target2,
    data.stop,
    data.invalidation,
    data.buy_trigger_price,
    data.price
  ].forEach(v => {

    if(Number.isFinite(Number(v)))
      values.push(Number(v));

  });

  if(!values.length)
    return;

  const min =
    Math.min(...values);

  const max =
    Math.max(...values);

  const range =
    max-min || 1;


  function x(i){

    if(history.length === 1)
      return pad.left+chartW/2;

    return pad.left+
      i/(history.length-1)*chartW;
  }


  function y(v){

    return pad.top+
      (max-v)/range*chartH;
  }


  ctx.font =
    "11px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif";


  /* GRID */

  ctx.strokeStyle =
    "#252b36";

  ctx.lineWidth = 1;

  for(let i=0;i<5;i++){

    const yy =
      pad.top+i/4*chartH;

    ctx.beginPath();
    ctx.moveTo(pad.left,yy);
    ctx.lineTo(width-pad.right,yy);
    ctx.stroke();

    const value =
      max-i/4*range;

    ctx.fillStyle =
      "#8992a3";

    ctx.fillText(
      money(value),
      4,
      yy+4
    );
  }


  /* SMA */

  function drawSMA(
    key,
    dashed
  ){

    ctx.beginPath();

    ctx.strokeStyle =
      key === "sma20"
        ? "#55a7ff"
        : "#a88cff";

    ctx.lineWidth = 1.7;

    ctx.setLineDash(
      dashed ? [5,4] : []
    );

    let started = false;

    history.forEach(
      (item,i) => {

        if(item[key] == null)
          return;

        const xx = x(i);
        const yy = y(Number(item[key]));

        if(!started){

          ctx.moveTo(xx,yy);
          started = true;

        }else{

          ctx.lineTo(xx,yy);

        }
      }
    );

    ctx.stroke();
    ctx.setLineDash([]);
  }


  drawSMA("sma20",false);
  drawSMA("sma50",true);


  /* LEVELS */

  function horizontal(
    value,
    label,
    type
  ){

    if(
      value == null ||
      !Number.isFinite(Number(value))
    )
      return;

    const yy =
      y(Number(value));

    if(type === "support")
      ctx.strokeStyle =
        "rgba(53,208,127,.65)";

    else if(type === "resistance")
      ctx.strokeStyle =
        "rgba(255,92,103,.65)";

    else if(type === "trigger")
      ctx.strokeStyle =
        "rgba(85,167,255,.9)";

    else if(type === "invalidation")
      ctx.strokeStyle =
        "rgba(255,92,103,.8)";

    else
      ctx.strokeStyle =
        "rgba(245,196,81,.65)";

    ctx.setLineDash(
      type === "trigger"
        ? [7,4]
        : [5,5]
    );

    ctx.beginPath();
    ctx.moveTo(pad.left,yy);
    ctx.lineTo(width-pad.right,yy);
    ctx.stroke();

    ctx.setLineDash([]);

    ctx.fillStyle =
      ctx.strokeStyle;

    ctx.fillText(
      label,
      pad.left+5,
      Math.max(
        12,
        yy-5
      )
    );
  }


  horizontal(
    data.fundamentals?.support,
    "Support",
    "support"
  );

  horizontal(
    data.fundamentals?.resistance,
    "Resistance",
    "resistance"
  );

  horizontal(
    data.buy_trigger_price,
    "BUY TRIGGER",
    "trigger"
  );

  horizontal(
    data.target1,
    "Target 1",
    "target"
  );

  horizontal(
    data.target2,
    "Target 2",
    "target"
  );

  horizontal(
    data.invalidation ?? data.stop,
    "Invalidation",
    "invalidation"
  );


  /* CANDLES */

  const candleWidth =
    Math.max(
      2,
      Math.min(
        9,
        chartW/history.length*.62
      )
    );


  history.forEach(
    (item,i) => {

      const xx = x(i);

      const open =
        Number(item.open);

      const close =
        Number(item.close);

      const high =
        Number(item.high);

      const low =
        Number(item.low);

      const openY = y(open);
      const closeY = y(close);
      const highY = y(high);
      const lowY = y(low);

      const bullish =
        close >= open;

      ctx.strokeStyle =
        bullish
          ? "#35d07f"
          : "#ff5c67";

      ctx.fillStyle =
        bullish
          ? "#35d07f"
          : "#ff5c67";

      ctx.lineWidth = 1;

      ctx.beginPath();
      ctx.moveTo(xx,highY);
      ctx.lineTo(xx,lowY);
      ctx.stroke();

      const top =
        Math.min(
          openY,
          closeY
        );

      const bodyH =
        Math.max(
          1,
          Math.abs(
            closeY-openY
          )
        );

      ctx.fillRect(
        xx-candleWidth/2,
        top,
        candleWidth,
        bodyH
      );
    }
  );


  /* CURRENT */

  const currentY =
    y(Number(data.price));

  ctx.strokeStyle =
    "#f2f4f7";

  ctx.setLineDash([2,3]);

  ctx.beginPath();
  ctx.moveTo(pad.left,currentY);
  ctx.lineTo(width-pad.right,currentY);
  ctx.stroke();

  ctx.setLineDash([]);

  ctx.fillStyle =
    "#f2f4f7";

  ctx.fillText(
    "Current",
    Math.max(
      pad.left+5,
      width-55
    ),
    Math.max(
      14,
      Math.min(
        height-30,
        currentY-5
      )
    )
  );


  /* DATES */

  ctx.fillStyle =
    "#8992a3";

  ctx.fillText(
    history[0].date.slice(5),
    pad.left,
    height-8
  );

  ctx.fillText(
    history[
      history.length-1
    ].date.slice(5),
    width-40,
    height-8
  );
}


/* =========================
   RSI
========================= */

function drawRSI(
  canvas,
  data
){

  const history =
    (data.history || [])
      .slice(-100);

  if(!history.length)
    return;

  const dpr =
    window.devicePixelRatio || 1;

  const width =
    canvas.clientWidth || 700;

  const height = 150;

  canvas.width = width*dpr;
  canvas.height = height*dpr;

  const ctx =
    canvas.getContext("2d");

  ctx.scale(dpr,dpr);

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  const left=35;
  const right=10;
  const top=12;
  const bottom=22;

  const w=width-left-right;
  const h=height-top-bottom;


  function x(i){

    if(history.length===1)
      return left+w/2;

    return left+
      i/(history.length-1)*w;
  }


  function y(v){

    return top+
      (100-v)/100*h;
  }


  ctx.strokeStyle="#252b36";
  ctx.lineWidth=1;

  [30,50,70].forEach(
    value => {

      const yy=y(value);

      ctx.beginPath();
      ctx.moveTo(left,yy);
      ctx.lineTo(width-right,yy);
      ctx.stroke();

      ctx.fillStyle="#8992a3";
      ctx.font="10px sans-serif";

      ctx.fillText(
        value,
        left-25,
        yy+3
      );
    }
  );


  ctx.beginPath();

  ctx.strokeStyle="#55a7ff";
  ctx.lineWidth=2;

  let started=false;

  history.forEach(
    (item,i) => {

      if(item.rsi==null)
        return;

      if(!started){

        ctx.moveTo(
          x(i),
          y(Number(item.rsi))
        );

        started=true;

      }else{

        ctx.lineTo(
          x(i),
          y(Number(item.rsi))
        );
      }
    }
  );

  ctx.stroke();

  ctx.fillStyle="#8992a3";
  ctx.font="10px sans-serif";

  ctx.fillText(
    "RSI 14",
    left,
    height-6
  );
}


/* =========================
   MACD
========================= */

function drawMACD(
  canvas,
  data
){

  const history =
    (data.history || [])
      .slice(-100);

  if(!history.length)
    return;

  const dpr =
    window.devicePixelRatio || 1;

  const width =
    canvas.clientWidth || 700;

  const height=150;

  canvas.width=width*dpr;
  canvas.height=height*dpr;

  const ctx =
    canvas.getContext("2d");

  ctx.scale(dpr,dpr);

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  const left=40;
  const right=10;
  const top=12;
  const bottom=22;

  const w=width-left-right;
  const h=height-top-bottom;

  const vals=[];

  history.forEach(item => {

    [
      item.macd,
      item.macdSignal,
      item.macdHistogram
    ].forEach(v => {

      if(v!=null)
        vals.push(Number(v));

    });

  });

  if(!vals.length)
    return;

  const maxAbs =
    Math.max(
      ...vals.map(
        v=>Math.abs(v)
      )
    ) || 1;


  function x(i){

    if(history.length===1)
      return left+w/2;

    return left+
      i/(history.length-1)*w;
  }


  function y(v){

    return top+
      (maxAbs-v)/
      (maxAbs*2)*h;
  }


  const zero=y(0);

  ctx.strokeStyle="#252b36";

  ctx.beginPath();
  ctx.moveTo(left,zero);
  ctx.lineTo(width-right,zero);
  ctx.stroke();


  const barW =
    Math.max(
      1,
      w/history.length*.65
    );


  history.forEach(
    (item,i) => {

      if(item.macdHistogram==null)
        return;

      const yy =
        y(Number(item.macdHistogram));

      ctx.fillStyle =
        Number(item.macdHistogram)>=0
          ? "rgba(53,208,127,.65)"
          : "rgba(255,92,103,.65)";

      ctx.fillRect(
        x(i)-barW/2,
        Math.min(yy,zero),
        barW,
        Math.abs(zero-yy)
      );
    }
  );


  function draw(
    key,
    dashed
  ){

    ctx.beginPath();

    ctx.strokeStyle =
      key==="macd"
        ? "#a88cff"
        : "#55a7ff";

    ctx.lineWidth=1.7;

    ctx.setLineDash(
      dashed
        ? [5,4]
        : []
    );

    let started=false;

    history.forEach(
      (item,i) => {

        if(item[key]==null)
          return;

        if(!started){

          ctx.moveTo(
            x(i),
            y(Number(item[key]))
          );

          started=true;

        }else{

          ctx.lineTo(
            x(i),
            y(Number(item[key]))
          );
        }
      }
    );

    ctx.stroke();

    ctx.setLineDash([]);
  }


  draw("macd",false);
  draw("macdSignal",true);

  ctx.fillStyle="#8992a3";
  ctx.font="10px sans-serif";

  ctx.fillText(
    "MACD",
    left,
    height-6
  );
}

/* =========================
   PULLBACK ENGINE
========================= */

function calculatePullback(data){

  const price =
    Number(data.price);

  const support =
    Number(
      data.fundamentals?.support
    );

  const resistance =
    Number(
      data.fundamentals?.resistance
    );

  const sma20 =
    Number(
      data.history?.length
        ? data.history[
            data.history.length-1
          ]?.sma20
        : NaN
    );

  const sma50 =
    Number(
      data.history?.length
        ? data.history[
            data.history.length-1
          ]?.sma50
        : NaN
    );

  const stop =
    Number(
      data.invalidation ??
      data.stop
    );


  /*
    Preferred pullback zone:

    Lower boundary:
    support

    Upper boundary:
    strongest of:
    support,
    SMA20,
    existing backend entry_high
  */

  let low =
    Number.isFinite(support)
      ? support
      : Number(data.entry_low);

  let highCandidates = [
    Number(data.entry_high),
    sma20,
    support
  ].filter(
    v => Number.isFinite(v)
  );

  let high =
    highCandidates.length
      ? Math.max(...highCandidates)
      : price;


  /*
    If price is already below the zone,
    use the current price as reference.
  */

  if(!Number.isFinite(low))
    low = price*0.95;

  if(!Number.isFinite(high))
    high = price*0.98;


  /*
    Make sure the zone is logically ordered.
  */

  if(high < low){

    const temp=high;
    high=low;
    low=temp;
  }


  /*
    Preferred entry is weighted toward
    the upper half of support/SMA zone.
  */

  const preferred =
    (low+high)/2;


  /*
    Invalidation:
    use backend invalidation if available.
  */

  const invalidation =
    Number.isFinite(stop)
      ? stop
      : low*0.98;


  /*
    Use existing targets.
  */

  let target1 =
    Number(data.target1);

  let target2 =
    Number(data.target2);


  if(!Number.isFinite(target1))
    target1 =
      Number.isFinite(resistance)
        ? resistance
        : price*1.08;

  if(!Number.isFinite(target2))
    target2 =
      target1*1.08;


  /*
    R/R based on preferred pullback entry.
  */

  const risk =
    preferred-invalidation;

  const reward1 =
    target1-preferred;

  const reward2 =
    target2-preferred;

  const rr1 =
    risk>0
      ? reward1/risk
      : NaN;

  const rr2 =
    risk>0
      ? reward2/risk
      : NaN;


  let quality =
    "NOT ATTRACTIVE";

  if(
    Number.isFinite(rr2) &&
    rr2>=2
  ){
    quality="ATTRACTIVE";

  }else if(
    Number.isFinite(rr2) &&
    rr2>=1.5
  ){
    quality="ACCEPTABLE";
  }


  /*
    Determine whether price is currently
    inside or near the pullback zone.
  */

  let status =
    "WAIT FOR PULLBACK";

  let statusClass =
    "sideways";


  if(
    price>=low &&
    price<=high
  ){

    status =
      "IN PULLBACK ZONE";

    statusClass =
      "bullish";

  }else if(
    price>high
  ){

    status =
      "ABOVE PULLBACK ZONE";

    statusClass =
      "blue";

  }else if(
    price<invalidation
  ){

    status =
      "PULLBACK INVALIDATED";

    statusClass =
      "bearish";
  }


  /*
    Pullback only makes sense when
    the larger structure is constructive.
  */

  const bullishStructure =
    String(
      data.structure || ""
    ).toUpperCase()
      .includes("HIGHER HIGH") &&
    String(
      data.structure || ""
    ).toUpperCase()
      .includes("HIGHER LOW");


  const shortTermBullish =
    String(
      data.short_term_trend || ""
    ).toUpperCase()
      .includes("BULLISH");


  let strategy =
    "WAIT — NO PULLBACK YET";

  if(price<invalidation){

    strategy =
      "AVOID — INVALIDATED";

  }else if(
    quality==="ATTRACTIVE" &&
    bullishStructure &&
    shortTermBullish &&
    price>=low &&
    price<=high
  ){

    strategy =
      "PULLBACK OPPORTUNITY";

  }else if(
    quality==="ATTRACTIVE" &&
    bullishStructure
  ){

    strategy =
      "WAIT FOR ATTRACTIVE PULLBACK";

  }else if(
    price>high
  ){

    strategy =
      "WAIT — PRICE ABOVE ZONE";

  }else{

    strategy =
      "PULLBACK R/R NOT ATTRACTIVE";
  }


  return {
    low,
    high,
    preferred,
    invalidation,
    target1,
    target2,
    risk,
    rr1,
    rr2,
    quality,
    status,
    statusClass,
    strategy,
    bullishStructure,
    shortTermBullish
  };
}

        }

      </ul>

    </div>


    <!-- TRADE LEVELS -->

    <div class="card">

      <div class="chartTitle">
        <h2>
          Trade levels
        </h2>
      </div>


      <div class="stats">

        <div class="stat">
          <div class="label">
            Buy zone low
          </div>
          <div class="value">
            ${money(data.entry_low)}
          </div>
        </div>

        <div class="stat">
          <div class="label">
            Buy zone high
          </div>
          <div class="value">
            ${money(data.entry_high)}
          </div>
        </div>

        <div class="stat">
          <div class="label">
            Support
          </div>
          <div class="value">
            ${money(
              data.fundamentals?.support
            )}
          </div>
        </div>

        <div class="stat">
          <div class="label">
            Resistance
          </div>
          <div class="value">
            ${money(
              data.fundamentals?.resistance
            )}
          </div>
        </div>

        <div class="stat">
          <div class="label">
            Buy trigger
          </div>
          <div class="value">
            ${money(
              data.buy_trigger_price
            )}
          </div>
        </div>

        <div class="stat">
          <div class="label">
            Invalidation
          </div>
          <div class="value">
            ${money(
              data.invalidation ??
              data.stop
            )}
          </div>
        </div>

        <div class="stat">
          <div class="label">
            Target 1
          </div>
          <div class="value">
            ${money(data.target1)}
          </div>
        </div>

        <div class="stat">
          <div class="label">
            Target 2
          </div>
          <div class="value">
            ${money(data.target2)}
          </div>
        </div>

      </div>

    </div>

  `;


  requestAnimationFrame(() => {

    drawPriceChart(
      document.getElementById(
        "priceChart"
      ),
      data
    );

    drawRSI(
      document.getElementById(
        "rsiChart"
      ),
      data
    );

    drawMACD(
      document.getElementById(
        "macdChart"
      ),
      data
    );

  });
}


/* =========================
   LOAD
========================= */

async function load(){

  setStatus(
    "Analyzing "+selected+"..."
  );

  try{

    const data =
      await api(selected);

    render(data);

    setStatus(
      "Analysis updated for "+selected
    );

  }catch(error){

    document.getElementById(
      "dashboard"
    ).innerHTML = `

      <div class="card">

        <strong>
          Unable to load ${esc(selected)}
        </strong>

        <div class="small">
          ${esc(error.message)}
        </div>

      </div>

    `;

    setStatus(
      "Data request failed."
    );
  }
}


/* =========================
   EVENTS
========================= */

document
  .getElementById("ticker")
  .addEventListener(
    "keydown",
    e => {

      if(e.key==="Enter")
        addTicker();

    }
  );


window.addEventListener(
  "resize",
  () => {

    if(!lastStockData)
      return;

    drawPriceChart(
      document.getElementById(
        "priceChart"
      ),
      lastStockData
    );

    drawRSI(
      document.getElementById(
        "rsiChart"
      ),
      lastStockData
    );

    drawMACD(
      document.getElementById(
        "macdChart"
      ),
      lastStockData
    );

  }
);


/* =========================
   INITIALIZE
========================= */

renderWatchlist();

load();

</script>

</body>
</html>
