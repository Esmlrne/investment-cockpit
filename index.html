<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12"><title>Investment Cockpit</title>
<style>
:root{--bg:#0b0d12;--card:#141821;--muted:#8992a3;--text:#f5f7fb;--line:#252b38;--green:#39d98a;--red:#ff6675;--yellow:#f4c95d;--blue:#6ea8fe}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
main{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 16px 40px}header{padding:22px 2px 16px;display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}
button,input{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;background:#202633;color:#fff;font-weight:700}.search{display:flex;gap:8px;margin:8px 0 18px}.search input{flex:1;min-width:0;background:#141821;border:1px solid var(--line);border-radius:12px;padding:12px;color:#fff;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.hero{padding:18px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.ticker{font-size:21px;font-weight:800}.price{font-size:30px;font-weight:850;margin-top:6px}.muted{color:var(--muted)}.pill{padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.buy{background:rgba(57,217,138,.14);color:var(--green)}.sell{background:rgba(255,102,117,.14);color:var(--red)}.watch{background:rgba(244,201,93,.14);color:var(--yellow)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#10141c;border-radius:14px;padding:12px}.metric b{display:block;font-size:18px;margin-top:5px}.section{font-size:16px;font-weight:800;margin:18px 2px 10px}.small{font-size:12px;color:var(--muted)}.reason{padding:9px 0}.reason span{color:var(--green);font-weight:900;margin-right:7px}.error{color:var(--red);font-size:13px}.foot{font-size:11px;color:#687183;text-align:center;padding:12px 0}
</style></head>
<body><main>
<header><div><h1>Investment Cockpit</h1><div class="sub">US stocks · Live data V2</div></div><button onclick="load()">↻</button></header>
<div class="search"><input id="ticker" placeholder="Add ticker, e.g. NVDA" maxlength="8"><button onclick="add()">＋ Add</button></div>
<div id="status" class="small"></div><div id="app"></div>
<div class="section">My watchlist</div><div class="card" id="watchlist"></div>
<div class="foot">Market data is provided through the configured server API. Signals are research outputs, not personalized financial advice.</div>
</main>
<script>
const key="ic_watchlist";let list=JSON.parse(localStorage.getItem(key)||'["NVDA","MSFT","GOOGL","AAPL","AMZN","TSLA"]');let selected=localStorage.getItem("ic_selected")||"NVDA";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function add(){let t=document.getElementById("ticker").value.trim().toUpperCase();if(!/^[A-Z.]{1,8}$/.test(t))return alert("Enter a valid US ticker.");if(!list.includes(t))list.unshift(t);selected=t;save();load()}
function save(){localStorage.setItem(key,JSON.stringify(list));localStorage.setItem("ic_selected",selected)}
async function api(t){let r=await fetch("/api/stock?ticker="+encodeURIComponent(t));let d=await r.json();if(!r.ok)throw Error(d.error||"Unable to load data");return d}
function signalClass(s){return s.includes("SELL")?"sell":s==="WATCH"?"watch":"buy"}
function render(d){
let c=signalClass(d.signal);document.getElementById("status").textContent="Last updated: "+new Date().toLocaleString();
document.getElementById("app").innerHTML=`<div class="card hero"><div class="row"><div><div class="ticker">${esc(d.symbol)}</div><div class="small">${esc(d.name||"US Equity")}</div></div><div class="pill ${c}">${esc(d.signal)}</div></div><div class="price">$${Number(d.price).toFixed(2)}</div><div class="small">${d.change_pct>=0?"▲":"▼"} ${Math.abs(d.change_pct).toFixed(2)}% today</div></div>
<div class="grid"><div class="metric"><div class="small">Investment score</div><b>${d.score}/100</b></div><div class="metric"><div class="small">RSI</div><b>${d.rsi??"—"}</b></div><div class="metric"><div class="small">Buy zone</div><b>${d.entry_low?"$"+d.entry_low+"–$"+d.entry_high:"—"}</b></div><div class="metric"><div class="small">Invalidation</div><b>${d.stop?"$"+d.stop:"—"}</b></div><div class="metric"><div class="small">Target 1</div><b>${d.target1?"$"+d.target1:"—"}</b></div><div class="metric"><div class="small">Target 2</div><b>${d.target2?"$"+d.target2:"—"}</b></div></div>
<div class="section">🧠 Why?</div><div class="card">${(d.reasons||[]).map(x=>`<div class="reason"><span>✓</span>${esc(x)}</div>`).join("")||"Not enough evidence yet."}</div>
<div class="section">⚠️ What could go wrong?</div><div class="card">${(d.risks||[]).map(x=>`<div class="reason">• ${esc(x)}</div>`).join("")||"No major warning triggered."}</div>
<div class="section">📊 Fundamentals</div><div class="card"><div class="grid">${Object.entries(d.fundamentals||{}).map(([k,v])=>`<div class="metric"><div class="small">${esc(k)}</div><b>${esc(v)}</b></div>`).join("")}</div></div>`}
async function load(){
document.getElementById("status").textContent="Loading live data…";try{let d=await api(selected);render(d);let rows=[];for(let t of list.slice(0,10)){try{let x=await api(t);rows.push(`<div class="row" style="padding:10px 0;border-bottom:1px solid #252b38" onclick="selected='${t}';save();load()"><b>${esc(t)}</b><span>$${Number(x.price).toFixed(2)}</span><span class="pill ${signalClass(x.signal)}">${esc(x.signal)}</span><b>${x.score}</b></div>`)}catch(e){}}document.getElementById("watchlist").innerHTML=rows.join("")}catch(e){document.getElementById("status").innerHTML='<span class="error">'+esc(e.message)+'</span>'}}
load();
</script></body></html>
