<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Investment Cockpit</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f6f8;
  color: #17191c;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 18px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

h1 {
  margin: 0;
  font-size: 28px;
}

.subtitle {
  color: #6b7078;
  font-size: 13px;
  margin-top: 4px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 11px 15px;
  font-weight: 700;
  cursor: pointer;
}

.primary {
  background: #111;
  color: white;
}

.secondary {
  background: #e5e7eb;
  color: #111;
}

.search-row {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

.search-row input {
  flex: 1;
  min-width: 0;
  border: 1px solid #d5d8dd;
  border-radius: 10px;
  padding: 12px;
  font-size: 16px;
  background: white;
}

.watchlist {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 18px;
}

.ticker {
  background: white;
  border: 1px solid #ddd;
  border-radius: 20px;
  padding: 8px 12px;
  font-weight: 700;
  cursor: pointer;
}

.ticker.active {
  background: #111;
  color: white;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

.loading {
  text-align: center;
  padding: 35px;
  color: #666;
}

.error {
  background: #fff0f0;
  color: #a00000;
  border: 1px solid #ffcaca;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 16px;
}

.stock-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 15px;
}

.symbol {
  font-size: 30px;
  font-weight: 800;
}

.company {
  color: #70757d;
  margin-top: 2px;
}

.price {
  font-size: 30px;
  font-weight: 800;
  text-align: right;
}

.change {
  text-align: right;
  font-weight: 700;
  margin-top: 3px;
}

.positive {
  color: #16833a;
}

.negative {
  color: #c62828;
}

.neutral {
  color: #777;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 18px;
}

.metric {
  background: #f7f7f8;
  border-radius: 12px;
  padding: 12px;
}

.metric-label {
  color: #70757d;
  font-size: 12px;
  margin-bottom: 5px;
}

.metric-value {
  font-size: 16px;
  font-weight: 800;
}

.section-title {
  font-size: 19px;
  font-weight: 800;
  margin-bottom: 14px;
}

.decision {
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 16px;
  background: #fafafa;
}

.decision-main {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  align-items: center;
  margin-bottom: 15px;
}

.decision-label {
  color: #666;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .05em;
}

.decision-value {
  font-size: 22px;
  font-weight: 900;
  margin-top: 4px;
}

.badge {
  display: inline-block;
  border-radius: 20px;
  padding: 7px 11px;
  font-size: 12px;
  font-weight: 800;
  background: #eee;
}

.badge.good {
  background: #e4f5e9;
  color: #176b32;
}

.badge.warn {
  background: #fff2d8;
  color: #8a5a00;
}

.badge.bad {
  background: #fde7e7;
  color: #a40000;
}

.conditions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 14px;
}

.condition {
  padding: 9px 10px;
  background: white;
  border-radius: 9px;
  font-size: 13px;
}

.condition.yes {
  color: #176b32;
}

.condition.no {
  color: #a40000;
}

.logic {
  margin-top: 14px;
  padding: 12px;
  border-radius: 10px;
  background: white;
  color: #555;
  font-size: 13px;
  line-height: 1.5;
}

.strategy-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.strategy {
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 16px;
}

.strategy h3 {
  margin: 0 0 12px;
  font-size: 17px;
}

.strategy-status {
  font-size: 18px;
  font-weight: 900;
  margin-bottom: 12px;
}

.strategy-table {
  width: 100%;
  border-collapse: collapse;
}

.strategy-table td {
  padding: 7px 0;
  border-bottom: 1px solid #eee;
  font-size: 13px;
}

.strategy-table td:last-child {
  text-align: right;
  font-weight: 800;
}

.rr {
  font-size: 20px;
  font-weight: 900;
}

.chart-wrapper {
  width: 100%;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  height: 420px;
  background: white;
  border-radius: 12px;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 10px;
  color: #666;
  font-size: 12px;
}

.legend span {
  display: flex;
  align-items: center;
  gap: 5px;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  display: inline-block;
}

.analysis-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.list {
  margin: 0;
  padding-left: 20px;
}

.list li {
  margin-bottom: 7px;
  font-size: 14px;
  line-height: 1.4;
}

.footer {
  text-align: center;
  color: #888;
  font-size: 11px;
  padding: 10px 0 25px;
}

@media (max-width: 750px) {

  .container {
    padding: 12px;
  }

  h1 {
    font-size: 23px;
  }

  .header {
    align-items: flex-start;
  }

  .grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .strategy-grid,
  .analysis-grid {
    grid-template-columns: 1fr;
  }

  .conditions {
    grid-template-columns: 1fr;
  }

  .stock-header {
    flex-direction: column;
  }

  .price {
    text-align: left;
  }

  .change {
    text-align: left;
  }

  canvas {
    height: 390px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div>
      <h1>Investment Cockpit</h1>
      <div class="subtitle">Technical analysis • Decision engine • Pullback & breakout strategy</div>
    </div>

    <button class="primary" onclick="loadStock(currentTicker)">
      Refresh
    </button>
  </div>

  <div class="search-row">
    <input
      id="tickerInput"
      placeholder="Add ticker e.g. NVDA"
      autocomplete="off"
      autocapitalize="characters"
    >
    <button class="primary" onclick="addTicker()">Add</button>
  </div>

  <div id="watchlist" class="watchlist"></div>

  <div id="error"></div>
  <div id="content"></div>

  <div class="footer">
    Investment Cockpit • Technical signals are decision support, not financial advice.
  </div>

</div>

<script>

let tickers = ["AAPL", "NVDA", "MSFT"];
let currentTicker = "AAPL";
let currentData = null;

const watchlistEl = document.getElementById("watchlist");
const contentEl = document.getElementById("content");
const errorEl = document.getElementById("error");

function money(v) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  return "$" + Number(v).toFixed(2);
}

function pct(v) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  const n = Number(v);
  return (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
}

function num(v, digits = 2) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  return Number(v).toFixed(digits);
}

function esc(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderWatchlist() {

  watchlistEl.innerHTML = tickers.map(t => `
    <div
      class="ticker ${t === currentTicker ? "active" : ""}"
      onclick="loadStock('${esc(t)}')"
    >
      ${esc(t)}
    </div>
  `).join("");
}

function addTicker() {

  const input = document.getElementById("tickerInput");
  const ticker = input.value.trim().toUpperCase();

  if (!ticker) return;

  if (!tickers.includes(ticker)) {
    tickers.push(ticker);
  }

  input.value = "";
  loadStock(ticker);
}

document.getElementById("tickerInput").addEventListener("keydown", e => {
  if (e.key === "Enter") addTicker();
});

async function loadStock(ticker) {

  currentTicker = ticker;
  renderWatchlist();

  errorEl.innerHTML = "";

  contentEl.innerHTML = `
    <div class="card loading">
      Loading ${esc(ticker)}...
    </div>
  `;

  try {

    const response = await fetch(
      "/api/stock?ticker=" + encodeURIComponent(ticker)
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Unable to load stock.");
    }

    currentData = data;

    renderDashboard(data);

  } catch (err) {

    errorEl.innerHTML = `
      <div class="error">
        <strong>Error:</strong> ${esc(err.message)}
      </div>
    `;

    contentEl.innerHTML = "";
  }
}

function renderDashboard(data) {

  const changeClass =
    Number(data.change_pct) > 0
      ? "positive"
      : Number(data.change_pct) < 0
      ? "negative"
      : "neutral";

  contentEl.innerHTML = `

    <div class="card">

      <div class="stock-header">

        <div>
          <div class="symbol">${esc(data.symbol)}</div>
          <div class="company">${esc(data.name || "")}</div>
        </div>

        <div>
          <div class="price">${money(data.price)}</div>
          <div class="change ${changeClass}">
            ${pct(data.change_pct)}
          </div>
        </div>

      </div>

      <div class="grid">

        <div class="metric">
          <div class="metric-label">Signal</div>
          <div class="metric-value">${esc(data.signal || "WATCH")}</div>
        </div>

        <div class="metric">
          <div class="metric-label">Score</div>
          <div class="metric-value">${num(data.score, 0)}/100</div>
        </div>

        <div class="metric">
          <div class="metric-label">Trend</div>
          <div class="metric-value">
            ${esc(data.trend || "—")}
          </div>
        </div>

        <div class="metric">
          <div class="metric-label">Trend Confidence</div>
          <div class="metric-value">
            ${num(data.trend_confidence, 0)}%
          </div>
        </div>

        <div class="metric">
          <div class="metric-label">RSI</div>
          <div class="metric-value">${num(data.rsi)}</div>
        </div>

        <div class="metric">
          <div class="metric-label">SMA 20</div>
          <div class="metric-value">${money(data.fundamentals?.sma20)}</div>
        </div>

        <div class="metric">
          <div class="metric-label">SMA 50</div>
          <div class="metric-value">${money(data.fundamentals?.sma50)}</div>
        </div>

        <div class="metric">
          <div class="metric-label">Structure</div>
          <div class="metric-value">
            ${esc(data.structure || "—")}
          </div>
        </div>

      </div>

    </div>

    ${renderDecisionCockpit(data)}

    ${renderStrategies(data)}

    <div class="card">

      <div class="section-title">
        Price & Technical Levels
      </div>

      <div class="chart-wrapper">
        <canvas id="priceChart"></canvas>
      </div>

      <div class="legend">

        <span>
          <span class="dot" style="background:#111"></span>
          Price
        </span>

        <span>
          <span class="dot" style="background:#777"></span>
          SMA20
        </span>

        <span>
          <span class="dot" style="background:#aaa"></span>
          SMA50
        </span>

        <span>
          Pullback zone
        </span>

      </div>

    </div>

    ${renderAnalysis(data)}

  `;

  drawChart(data);
}

function renderDecisionCockpit(data) {

  const confirmed = !!data.buy_trigger_confirmed;

  let badgeClass = confirmed ? "good" : "warn";

  const conditions = Array.isArray(data.buy_conditions)
    ? data.buy_conditions
    : [];

  const met =
    data.conditions_met !== undefined
      ? data.conditions_met
      : conditions.filter(Boolean).length;

  const total =
    data.conditions_total !== undefined
      ? data.conditions_total
      : conditions.length;

  const rrQuality =
    data.risk_reward_quality || "—";

  let rrClass = "warn";

  if (rrQuality === "ATTRACTIVE") rrClass = "good";
  if (rrQuality === "NOT ATTRACTIVE") rrClass = "bad";

  return `

    <div class="card">

      <div class="section-title">
        Decision Cockpit
      </div>

      <div class="decision">

        <div class="decision-main">

          <div>
            <div class="decision-label">
              Buy trigger
            </div>

            <div class="decision-value">
              ${esc(data.buy_trigger || "WAIT")}
            </div>

            ${
              data.buy_trigger_price
                ? `
                <div style="margin-top:5px;color:#666;font-size:13px">
                  Trigger price:
                  <strong>${money(data.buy_trigger_price)}</strong>
                </div>
                `
                : ""
            }

          </div>

          <div>
            <span class="badge ${badgeClass}">
              ${confirmed ? "CONFIRMED" : "WAIT"}
            </span>
          </div>

        </div>

        <div class="grid">

          <div class="metric">
            <div class="metric-label">Invalidation</div>
            <div class="metric-value">
              ${money(data.invalidation || data.stop)}
            </div>
          </div>

          <div class="metric">
            <div class="metric-label">Risk / Share</div>
            <div class="metric-value">
              ${money(data.risk_per_share)}
            </div>
          </div>

          <div class="metric">
            <div class="metric-label">Target 1</div>
            <div class="metric-value">
              ${money(data.target1)}
            </div>
          </div>

          <div class="metric">
            <div class="metric-label">Target 2</div>
            <div class="metric-value">
              ${money(data.target2)}
            </div>
          </div>

          <div class="metric">
            <div class="metric-label">R/R → T1</div>
            <div class="metric-value">
              ${num(data.risk_reward_target1)}x
            </div>
          </div>

          <div class="metric">
            <div class="metric-label">R/R → T2</div>
            <div class="metric-value">
              ${num(data.risk_reward_target2)}x
            </div>
          </div>

          <div class="metric">
            <div class="metric-label">R/R Quality</div>
            <div class="metric-value">
              <span class="badge ${rrClass}">
                ${esc(rrQuality)}
              </span>
            </div>
          </div>

          <div class="metric">
            <div class="metric-label">Confirmation</div>
            <div class="metric-value">
              ${met}/${total}
            </div>
          </div>

        </div>

        <div class="logic">
          <strong>Trigger logic:</strong><br>
          ${esc(
            data.trigger_reason ||
            "Wait for confirmation before entering."
          )}
        </div>

        <div class="logic">
          <strong>Invalidation logic:</strong><br>
          ${esc(
            data.invalidation_reason ||
            "Setup is invalidated if price breaks the key support level."
          )}
        </div>

      </div>

    </div>

  `;
}

function renderStrategies(data) {

  const price = Number(data.price);

  const support = Number(
    data.fundamentals?.support ??
    data.entry_low ??
    data.stop
  );

  const resistance = Number(
    data.fundamentals?.resistance ??
    data.entry_high
  );

  const sma20 = Number(data.fundamentals?.sma20);

  const zoneLow = isFinite(support)
    ? support
    : price * 0.95;

  const zoneHighCandidates = [
    isFinite(sma20) ? sma20 : NaN,
    isFinite(resistance) ? resistance : NaN,
    price
  ].filter(v => isFinite(v));

  /*
    Pullback zone should NOT extend all the way to resistance.
    We want a realistic area near support / SMA20.
  */

  let pullbackHigh;

  if (isFinite(sma20) && sma20 > zoneLow) {
    pullbackHigh = Math.min(
      sma20,
      zoneLow + Math.max(
        price * 0.06,
        (resistance - zoneLow) * 0.35
      )
    );
  } else {
    pullbackHigh =
      zoneLow +
      Math.max(
        price * 0.04,
        (resistance - zoneLow) * 0.30
      );
  }

  if (!isFinite(pullbackHigh) || pullbackHigh <= zoneLow) {
    pullbackHigh = zoneLow * 1.04;
  }

  const bestEntry = zoneLow + (pullbackHigh - zoneLow) * 0.25;
  const baseEntry = zoneLow + (pullbackHigh - zoneLow) * 0.50;
  const worstEntry = zoneLow + (pullbackHigh - zoneLow) * 0.75;

  const invalidation = Number(
    data.invalidation ??
    data.stop ??
    zoneLow
  );

  const target1 = Number(data.target1);
  const target2 = Number(data.target2);

  function rr(entry, target) {

    const risk = entry - invalidation;
    const reward = target - entry;

    if (!isFinite(risk) || risk <= 0) return null;
    if (!isFinite(reward)) return null;

    return reward / risk;
  }

  const baseRR1 = rr(baseEntry, target1);
  const baseRR2 = rr(baseEntry, target2);

  let pullbackStatus = "WAIT FOR PULLBACK";
  let pullbackStrategy = "WAIT";

  if (price < zoneLow) {
    pullbackStatus = "PULLBACK INVALIDATED";
    pullbackStrategy = "AVOID";
  } else if (price >= zoneLow && price <= pullbackHigh) {
    pullbackStatus = "IN PULLBACK ZONE";

    if (
      baseRR1 !== null &&
      baseRR1 >= 2 &&
      data.short_term_trend === "BULLISH"
    ) {
      pullbackStrategy = "PULLBACK OPPORTUNITY";
    } else {
      pullbackStrategy = "WAIT FOR CONFIRMATION";
    }

  } else {
    pullbackStatus = "ABOVE PULLBACK ZONE";
    pullbackStrategy = "WAIT FOR PULLBACK";
  }

  const breakoutTrigger = Number(
    data.buy_trigger_price ??
    (isFinite(resistance) ? resistance * 1.002 : price * 1.02)
  );

  const breakoutConfirmed =
    !!data.buy_trigger_confirmed &&
    price >= breakoutTrigger;

  const breakoutStatus = breakoutConfirmed
    ? "BREAKOUT CONFIRMED"
    : "WAIT FOR BREAKOUT";

  return `

    <div class="card">

      <div class="section-title">
        Entry Strategies
      </div>

      <div class="strategy-grid">

        <!-- BREAKOUT -->

        <div class="strategy">

          <h3>🚀 Breakout Strategy</h3>

          <div class="strategy-status">
            ${esc(breakoutStatus)}
          </div>

          <table class="strategy-table">

            <tr>
              <td>Resistance</td>
              <td>${money(resistance)}</td>
            </tr>

            <tr>
              <td>Trigger</td>
              <td>${money(breakoutTrigger)}</td>
            </tr>

            <tr>
              <td>Invalidation</td>
              <td>${money(invalidation)}</td>
            </tr>

            <tr>
              <td>Target 1</td>
              <td>${money(target1)}</td>
            </tr>

            <tr>
              <td>Target 2</td>
              <td>${money(target2)}</td>
            </tr>

          </table>

          <div class="logic">
            Enter only after a daily close above resistance
            with momentum and candle confirmation.
          </div>

        </div>


        <!-- PULLBACK -->

        <div class="strategy">

          <h3>🎯 Pullback Strategy</h3>

          <div class="strategy-status">
            ${esc(pullbackStatus)}
          </div>

          <table class="strategy-table">

            <tr>
              <td>Pullback zone</td>
              <td>
                ${money(zoneLow)} – ${money(pullbackHigh)}
              </td>
            </tr>

            <tr>
              <td>Best entry</td>
              <td>${money(bestEntry)}</td>
            </tr>

            <tr>
              <td>Base entry</td>
              <td>${money(baseEntry)}</td>
            </tr>

            <tr>
              <td>Invalidation</td>
              <td>${money(invalidation)}</td>
            </tr>

            <tr>
              <td>Target 1</td>
              <td>${money(target1)}</td>
            </tr>

            <tr>
              <td>Target 2</td>
              <td>${money(target2)}</td>
            </tr>

          </table>

          <div style="margin-top:14px">

            <div class="metric-label">
              Realistic entry scenarios
            </div>

            <table class="strategy-table">

              <tr>
                <td>Best entry R/R → T1</td>
                <td>
                  ${baseRR1 === null ? "—" : baseRR1.toFixed(2) + "x"}
                </td>
              </tr>

              <tr>
                <td>Base entry R/R → T1</td>
                <td>
                  ${baseRR1 === null ? "—" : baseRR1.toFixed(2) + "x"}
                </td>
              </tr>

              <tr>
                <td>Base entry R/R → T2</td>
                <td>
                  ${baseRR2 === null ? "—" : baseRR2.toFixed(2) + "x"}
                </td>
              </tr>

            </table>

          </div>

          <div class="logic">
            <strong>Strategy:</strong>
            ${esc(pullbackStrategy)}.
            Prefer a bullish reaction from support/SMA20
            rather than buying an extended price.
          </div>

        </div>

      </div>

    </div>

  `;
}

function renderAnalysis(data) {

  const reasons = Array.isArray(data.reasons)
    ? data.reasons
    : [];

  const risks = Array.isArray(data.risks)
    ? data.risks
    : [];

  return `

    <div class="card">

      <div class="section-title">
        Technical Diagnosis
      </div>

      <div class="analysis-grid">

        <div>

          <h3>Why</h3>

          <ul class="list">

            ${
              reasons.length
                ? reasons.map(x => `<li>${esc(x)}</li>`).join("")
                : "<li>No major positive factors detected.</li>"
            }

          </ul>

        </div>

        <div>

          <h3>Risks</h3>

          <ul class="list">

            ${
              risks.length
                ? risks.map(x => `<li>${esc(x)}</li>`).join("")
                : "<li>No major risks identified.</li>"
            }

          </ul>

        </div>

      </div>

    </div>

  `;
}


/* ============================================================
   CHART
   ============================================================ */

function drawChart(data) {

  const canvas = document.getElementById("priceChart");

  if (!canvas) return;

  const ctx = canvas.getContext("2d");

  const rect = canvas.getBoundingClientRect();

  const dpr = window.devicePixelRatio || 1;

  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;

  ctx.scale(dpr, dpr);

  const W = rect.width;
  const H = rect.height;

  ctx.clearRect(0, 0, W, H);

  const history = Array.isArray(data.history)
    ? data.history
    : [];

  if (history.length < 2) {

    ctx.fillStyle = "#777";
    ctx.font = "14px Arial";
    ctx.fillText("Not enough historical data.", 20, 30);

    return;
  }

  /*
    IMPORTANT:
    The old chart included distant values in the Y-axis calculation,
    which caused the chart to collapse toward $0.

    This version calculates the visible range mainly from historical
    price action and only adds levels that are reasonably close.
  */

  const closes = history
    .map(x => Number(x.close))
    .filter(isFinite);

  const highs = history
    .map(x => Number(x.high))
    .filter(isFinite);

  const lows = history
    .map(x => Number(x.low))
    .filter(isFinite);

  if (!closes.length) return;

  const recentPrices = history.slice(-80);

  const recentHighs = recentPrices
    .map(x => Number(x.high))
    .filter(isFinite);

  const recentLows = recentPrices
    .map(x => Number(x.low))
    .filter(isFinite);

  let minPrice = Math.min(...recentLows);
  let maxPrice = Math.max(...recentHighs);

  const current = Number(data.price);

  const support = Number(
    data.fundamentals?.support ??
    data.entry_low ??
    data.stop
  );

  const resistance = Number(
    data.fundamentals?.resistance ??
    data.entry_high
  );

  const sma20 = Number(data.fundamentals?.sma20);
  const sma50 = Number(data.fundamentals?.sma50);
  const target1 = Number(data.target1);
  const target2 = Number(data.target2);
  const stop = Number(data.invalidation ?? data.stop);

  /*
    Only include technical levels if they are within a sensible
    distance of the current visible range.
  */

  const candidates = [
    support,
    resistance,
    sma20,
    sma50,
    target1,
    target2,
    stop,
    current
  ].filter(v => isFinite(v) && v > 0);

  const baseRange = Math.max(
    maxPrice - minPrice,
    current * 0.10
  );

  const expandedMin = current - baseRange * 0.70;
  const expandedMax = current + baseRange * 0.70;

  candidates.forEach(v => {

    if (
      v >= expandedMin &&
      v <= expandedMax
    ) {
      minPrice = Math.min(minPrice, v);
      maxPrice = Math.max(maxPrice, v);
    }

  });

  /*
    Add padding around the visible price area.
  */

  const range = Math.max(
    maxPrice - minPrice,
    current * 0.08
  );

  minPrice -= range * 0.10;
  maxPrice += range * 0.10;

  /*
    Never allow the chart to collapse toward zero.
  */

  if (minPrice < current * 0.55) {
    minPrice = current * 0.55;
  }

  const pad = {
    top: 22,
    bottom: 30,
    left: 45,
    right: 125
  };

  const chartW = W - pad.left - pad.right;
  const chartH = H - pad.top - pad.bottom;

  function x(i) {

    return pad.left +
      (i / (history.length - 1)) * chartW;

  }

  function y(value) {

    return pad.top +
      (maxPrice - value) /
      (maxPrice - minPrice) *
      chartH;

  }

  /*
    Grid
  */

  ctx.strokeStyle = "#eeeeee";
  ctx.lineWidth = 1;

  for (let i = 0; i <= 5; i++) {

    const yy = pad.top +
      (i / 5) * chartH;

    ctx.beginPath();
    ctx.moveTo(pad.left, yy);
    ctx.lineTo(W - pad.right, yy);
    ctx.stroke();

    const value =
      maxPrice -
      (i / 5) *
      (maxPrice - minPrice);

    ctx.fillStyle = "#888";
    ctx.font = "11px Arial";
    ctx.fillText(
      money(value),
      3,
      yy + 4
    );

  }

  /*
    Pullback zone
  */

  const zoneLow = isFinite(support)
    ? support
    : NaN;

  let zoneHigh = NaN;

  if (isFinite(zoneLow)) {

    if (isFinite(sma20) && sma20 > zoneLow) {

      zoneHigh = Math.min(
        sma20,
        zoneLow +
        Math.max(
          current * 0.06,
          (isFinite(resistance)
            ? resistance - zoneLow
            : current * 0.10) * 0.35
        )
      );

    } else {

      zoneHigh =
        zoneLow +
        current * 0.05;

    }

    /*
      Only draw the zone if it is visible.
    */

    if (
      zoneHigh > minPrice &&
      zoneLow < maxPrice
    ) {

      const topY = y(
        Math.min(zoneHigh, maxPrice)
      );

      const bottomY = y(
        Math.max(zoneLow, minPrice)
      );

      ctx.fillStyle = "rgba(100,100,100,0.08)";

      ctx.fillRect(
        pad.left,
        topY,
        chartW,
        bottomY - topY
      );

    }

  }

  /*
    Price line
  */

  ctx.beginPath();

  history.forEach((item, i) => {

    const value = Number(item.close);

    if (!isFinite(value)) return;

    const xx = x(i);
    const yy = y(value);

    if (i === 0) {
      ctx.moveTo(xx, yy);
    } else {
      ctx.lineTo(xx, yy);
    }

  });

  ctx.strokeStyle = "#111";
  ctx.lineWidth = 2.2;
  ctx.stroke();

  /*
    SMA20
  */

  drawIndicatorLine(
    ctx,
    history,
    "sma20",
    x,
    y,
    "#777",
    1.4
  );

  /*
    SMA50
  */

  drawIndicatorLine(
    ctx,
    history,
    "sma50",
    x,
    y,
    "#aaa",
    1.3
  );

  /*
    Technical level labels
  */

  const levels = [];

  function addLevel(label, value) {

    if (
      !isFinite(value) ||
      value <= 0
    ) return;

    /*
      Do not show extremely distant levels.
    */

    if (
      value < minPrice ||
      value > maxPrice
    ) return;

    levels.push({
      label,
      value,
      rawY: y(value)
    });

  }

  addLevel("Resistance", resistance);
  addLevel("Target 1", target1);
  addLevel("Target 2", target2);
  addLevel("Support", support);
  addLevel("Invalidation", stop);
  addLevel("Current", current);

  /*
    Sort labels vertically so they don't overlap.
  */

  levels.sort((a, b) => a.rawY - b.rawY);

  const minSpacing = 24;

  levels.forEach((level, index) => {

    if (index === 0) {

      level.labelY = Math.max(
        pad.top + 10,
        level.rawY
      );

    } else {

      level.labelY = Math.max(
        level.rawY,
        levels[index - 1].labelY + minSpacing
      );

    }

  });

  /*
    Keep last labels inside chart.
  */

  for (
    let i = levels.length - 1;
    i >= 0;
    i--
  ) {

    if (
      levels[i].labelY >
      H - pad.bottom - 10
    ) {

      levels[i].labelY =
        H - pad.bottom - 10 -
        (levels.length - 1 - i) * minSpacing;

    }

  }

  levels.forEach(level => {

    const actualY = level.rawY;
    const labelY = level.labelY;

    /*
      Leader line
    */

    ctx.strokeStyle = "#c9c9c9";
    ctx.lineWidth = 1;

    ctx.beginPath();

    ctx.moveTo(
      W - pad.right,
      actualY
    );

    ctx.lineTo(
      W - pad.right + 8,
      labelY
    );

    ctx.stroke();

    /*
      Horizontal level line
    */

    ctx.setLineDash([4, 4]);

    ctx.strokeStyle = "#dddddd";

    ctx.beginPath();

    ctx.moveTo(
      pad.left,
      actualY
    );

    ctx.lineTo(
      W - pad.right,
      actualY
    );

    ctx.stroke();

    ctx.setLineDash([]);

    /*
      Label background
    */

    ctx.fillStyle = "white";

    ctx.fillRect(
      W - pad.right + 10,
      labelY - 9,
      108,
      18
    );

    ctx.fillStyle = "#444";
    ctx.font = "11px Arial";

    ctx.fillText(
      level.label + " " + money(level.value),
      W - pad.right + 13,
      labelY + 4
    );

  });

  /*
    Current price marker
  */

  if (isFinite(current)) {

    const cy = y(current);

    ctx.beginPath();

    ctx.arc(
      x(history.length - 1),
      cy,
      4,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "#111";
    ctx.fill();

  }

  /*
    Dates
  */

  const firstDate = history[0]?.date;
  const lastDate =
    history[history.length - 1]?.date;

  ctx.fillStyle = "#888";
  ctx.font = "10px Arial";

  if (firstDate) {

    ctx.fillText(
      firstDate,
      pad.left,
      H - 8
    );

  }

  if (lastDate) {

    ctx.fillText(
      lastDate,
      W - pad.right - 70,
      H - 8
    );

  }

}

function drawIndicatorLine(
  ctx,
  history,
  field,
  x,
  y,
  stroke,
  width
) {

  ctx.beginPath();

  let started = false;

  history.forEach((item, i) => {

    const value = Number(item[field]);

    if (!isFinite(value)) return;

    const xx = x(i);
    const yy = y(value);

    if (!started) {

      ctx.moveTo(xx, yy);
      started = true;

    } else {

      ctx.lineTo(xx, yy);

    }

  });

  ctx.strokeStyle = stroke;
  ctx.lineWidth = width;
  ctx.stroke();

}


/*
   Resize chart when phone rotates / window changes.
*/

window.addEventListener("resize", () => {

  if (currentData) {
    setTimeout(
      () => drawChart(currentData),
      100
    );
  }

});


/*
   Initial load
*/

renderWatchlist();
loadStock(currentTicker);

</script>
