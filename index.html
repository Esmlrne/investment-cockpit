<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Investment Cockpit</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f7fb;
  color: #172033;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 24px 18px 50px;
}

header {
  margin-bottom: 22px;
}

h1 {
  margin: 0;
  font-size: 30px;
  letter-spacing: -0.8px;
}

.subtitle {
  color: #71809a;
  margin-top: 6px;
  font-size: 15px;
}

.search-row {
  display: flex;
  gap: 9px;
  margin-top: 18px;
}

input {
  flex: 1;
  min-width: 0;
  border: 1px solid #d9dfeb;
  border-radius: 13px;
  padding: 13px 14px;
  font-size: 16px;
  background: white;
}

button {
  border: 0;
  border-radius: 13px;
  padding: 0 17px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  background: #172033;
  color: white;
}

.watchlist {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 14px 0 5px;
}

.ticker {
  flex: 0 0 auto;
  background: white;
  border: 1px solid #dce2ec;
  color: #29354b;
  padding: 9px 14px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: 700;
}

.ticker.active {
  background: #172033;
  color: white;
}

.card {
  background: white;
  border: 1px solid #dce2ec;
  border-radius: 22px;
  padding: 22px;
  margin-top: 16px;
  box-shadow: 0 4px 18px rgba(30, 45, 70, .035);
}

.hero {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: flex-start;
}

.company-name {
  color: #71809a;
  margin-top: 5px;
}

.price {
  font-size: 34px;
  font-weight: 800;
  margin-top: 14px;
}

.change {
  font-weight: 700;
  margin-top: 3px;
}

.hero-right {
  text-align: right;
}

.decision {
  font-size: 20px;
  font-weight: 800;
  padding: 9px 14px;
  border-radius: 12px;
  display: inline-block;
}

.buy {
  background: #e7f7ed;
  color: #18733d;
}

.watch {
  background: #fff5d9;
  color: #8b6500;
}

.sell {
  background: #fdeaea;
  color: #a72c2c;
}

.avoid {
  background: #edf0f5;
  color: #5d687a;
}

.score {
  margin-top: 12px;
  color: #68758a;
}

.score strong {
  color: #172033;
  font-size: 24px;
}

.section-title {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 1.4px;
  color: #78869e;
  margin: 4px 0 15px;
  text-transform: uppercase;
}

.investor-summary {
  font-size: 18px;
  line-height: 1.55;
  color: #29354b;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.grid3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.metric {
  background: #f8f9fc;
  border-radius: 15px;
  padding: 15px;
}

.metric-label {
  font-size: 12px;
  color: #7d899d;
  margin-bottom: 6px;
}

.metric-value {
  font-size: 19px;
  font-weight: 800;
}

.metric-small {
  font-size: 13px;
  color: #71809a;
  margin-top: 4px;
}

.health-score {
  font-size: 38px;
  font-weight: 800;
}

.progress {
  height: 8px;
  background: #e9edf3;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 10px;
}

.progress-inner {
  height: 100%;
  width: 0;
  background: #172033;
  border-radius: 20px;
}

.health-status {
  font-weight: 800;
  margin-top: 7px;
}

.good {
  color: #18733d;
}

.bad {
  color: #a72c2c;
}

.neutral {
  color: #8b6500;
}

.news-item {
  padding: 14px 0;
  border-bottom: 1px solid #edf0f4;
}

.news-item:last-child {
  border-bottom: 0;
}

.news-item a {
  color: #172033;
  text-decoration: none;
  font-weight: 700;
  line-height: 1.4;
}

.news-source {
  color: #8290a5;
  font-size: 12px;
  margin-top: 5px;
}

.entry-highlight {
  background: #f4f7fb;
  border: 1px solid #e0e6ef;
  border-radius: 17px;
  padding: 18px;
}

.entry-price {
  font-size: 28px;
  font-weight: 800;
}

.rr {
  font-size: 20px;
  font-weight: 800;
}

.risk-box {
  background: #fff8f7;
  border: 1px solid #f1dddd;
  border-radius: 17px;
  padding: 17px;
}

.positive-box {
  background: #f5fbf7;
  border: 1px solid #dceee3;
  border-radius: 17px;
  padding: 17px;
}

ul {
  padding-left: 20px;
  margin: 8px 0;
}

li {
  margin: 9px 0;
  line-height: 1.4;
}

.chart-wrap {
  position: relative;
  width: 100%;
  overflow-x: auto;
}

canvas {
  width: 100%;
  height: 350px;
  display: block;
}

.chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 12px;
  color: #71809a;
  font-size: 12px;
}

.legend {
  display: flex;
  align-items: center;
  gap: 5px;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #172033;
}

.loading {
  text-align: center;
  padding: 50px 10px;
  color: #71809a;
}

.error {
  background: #fff0f0;
  border: 1px solid #efcccc;
  color: #a72c2c;
  padding: 16px;
  border-radius: 14px;
  margin-top: 15px;
}

details {
  margin-top: 16px;
}

summary {
  cursor: pointer;
  font-weight: 800;
  color: #65738a;
  padding: 5px 0;
}

.footer {
  text-align: center;
  color: #94a1b5;
  font-size: 12px;
  margin-top: 25px;
}

@media (max-width: 650px) {
  .container {
    padding: 17px 12px 40px;
  }

  h1 {
    font-size: 27px;
  }

  .hero {
    flex-direction: column;
  }

  .hero-right {
    text-align: left;
  }

  .grid,
  .grid3 {
    grid-template-columns: 1fr;
  }

  .card {
    padding: 17px;
    border-radius: 18px;
  }

  canvas {
    height: 300px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>Investment Cockpit</h1>
  <div class="subtitle">
    Understand the company first. Then decide when to buy.
  </div>

  <div class="search-row">
    <input id="tickerInput" placeholder="Enter ticker e.g. AAPL">
    <button onclick="analyze()">Analyze</button>
  </div>

  <div class="watchlist">
    <button class="ticker active" onclick="selectTicker('AAPL')">AAPL</button>
    <button class="ticker" onclick="selectTicker('NVDA')">NVDA</button>
    <button class="ticker" onclick="selectTicker('MSFT')">MSFT</button>
    <button class="ticker" onclick="selectTicker('AMZN')">AMZN</button>
  </div>
</header>

<div id="app">
  <div class="loading">Loading investment cockpit...</div>
</div>

</div>

<script>

let currentTicker = "AAPL";
let currentData = null;

function money(v) {
  if (v === null || v === undefined || !Number.isFinite(Number(v))) {
    return "N/A";
  }

  return "$" + Number(v).toLocaleString(undefined, {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function percent(v) {
  if (v === null || v === undefined || !Number.isFinite(Number(v))) {
    return "N/A";
  }

  return Number(v).toFixed(1) + "%";
}

function multiple(v) {
  if (v === null || v === undefined || !Number.isFinite(Number(v))) {
    return "N/A";
  }

  return Number(v).toFixed(1) + "x";
}

function classForDecision(decision) {
  if (!decision) return "watch";

  if (decision.includes("BUY")) return "buy";
  if (decision === "SELL") return "sell";
  if (decision === "AVOID") return "avoid";

  return "watch";
}

function valueClass(v) {
  if (v === null || v === undefined) return "neutral";

  if (Number(v) > 0) return "good";
  if (Number(v) < 0) return "bad";

  return "neutral";
}

function trendClass(text) {
  if (!text) return "neutral";

  const t = String(text).toUpperCase();

  if (
    t.includes("IMPROV") ||
    t.includes("STRONG") ||
    t.includes("BULLISH") ||
    t.includes("HEALTHY") ||
    t.includes("EXCELLENT") ||
    t.includes("ATTRACTIVE")
  ) {
    return "good";
  }

  if (
    t.includes("DECLIN") ||
    t.includes("WEAK") ||
    t.includes("BEARISH") ||
    t.includes("EXPENSIVE")
  ) {
    return "bad";
  }

  return "neutral";
}

function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function investorSummary(d) {

  const health = d.company_health?.status || "UNKNOWN";
  const growth = d.growth?.trend || "UNKNOWN";
  const profit = d.profitability?.trend || "UNKNOWN";
  const valuation = d.valuation?.view || "UNKNOWN";
  const decision = d.decision || "WATCH";

  let message = "";

  if (decision.includes("BUY")) {
    message = `The company looks ${health.toLowerCase()}, with ${growth.toLowerCase()} growth and ${profit.toLowerCase()} profitability. The current setup supports a ${decision} view.`;
  } else if (decision === "SELL") {
    message = `The current setup is defensive. Despite the company's fundamentals, the technical picture is weakening and deserves caution.`;
  } else {
    message = `The company is currently showing ${health.toLowerCase()} fundamentals. Growth is ${growth.toLowerCase()} and profitability is ${profit.toLowerCase()}. The setup needs more confirmation before taking action.`;
  }

  return message;
}

function buildRisks(d) {

  const risks = [];

  const rsi = Number(d.rsi);
  const score = Number(d.score);
  const health = Number(d.company_health?.score);
  const pe = Number(d.valuation?.pe);

  if (
    d.trend === "SIDEWAYS"
  ) {
    risks.push("The price trend is not clearly established.");
  }

  if (
    d.structure_direction === "BEARISH" ||
    d.structure?.includes("LOWER")
  ) {
    risks.push("Market structure is deteriorating.");
  }

  if (
    Number.isFinite(rsi) &&
    rsi > 72
  ) {
    risks.push(`Momentum is becoming overbought (RSI ${rsi.toFixed(0)}).`);
  }

  if (
    Number.isFinite(pe) &&
    pe > 40
  ) {
    risks.push(`Valuation is demanding with a P/E of ${pe.toFixed(1)}x.`);
  }

  if (
    Number.isFinite(health) &&
    health < 60
  ) {
    risks.push("Company fundamentals are not strong enough to fully support the setup.");
  }

  if (
    Number.isFinite(score) &&
    score < 55
  ) {
    risks.push("The overall investment score remains below the preferred range.");
  }

  if (
    d.price &&
    d.resistance &&
    Number(d.price) > Number(d.resistance) * 0.97 &&
    !d.breakout_confirmed
  ) {
    risks.push("Price is close to resistance and may need a confirmed breakout.");
  }

  if (
    d.risk_reward_target1 !== null &&
    Number(d.risk_reward_target1) < 1.5
  ) {
    risks.push("The current risk/reward is not particularly attractive.");
  }

  if (
    d.growth?.revenue_growth !== null &&
    Number(d.growth.revenue_growth) < 0
  ) {
    risks.push("Revenue growth is currently negative.");
  }

  if (
    d.growth?.profit_growth !== null &&
    Number(d.growth.profit_growth) < 0
  ) {
    risks.push("Profit growth is currently negative.");
  }

  if (!risks.length) {
    risks.push("No major risk flag detected from the current data. Continue monitoring valuation, trend and earnings.");
  }

  return risks;
}

function buildPositives(d) {

  const positives = [];

  if (
    Number(d.company_health?.score) >= 70
  ) {
    positives.push("Company fundamentals are healthy.");
  }

  if (
    Number(d.growth?.revenue_growth) > 0
  ) {
    positives.push(`Revenue is growing ${percent(d.growth.revenue_growth)} year-over-year.`);
  }

  if (
    Number(d.growth?.profit_growth) > 0
  ) {
    positives.push(`Profit is growing ${percent(d.growth.profit_growth)}.`);
  }

  if (
    d.trend === "BULLISH"
  ) {
    positives.push("Price trend is bullish.");
  }

  if (
    d.structure?.includes("HIGHER")
  ) {
    positives.push("Market structure is improving.");
  }

  if (
    Number(d.risk_reward_target1) >= 2
  ) {
    positives.push(`Risk/reward to Target 1 is attractive at ${Number(d.risk_reward_target1).toFixed(1)}x.`);
  }

  if (
    d.breakout_confirmed
  ) {
    positives.push("Price has confirmed a breakout above resistance.");
  }

  if (
    d.candle_bullish
  ) {
    positives.push(`Recent candle pattern is bullish (${d.candle_pattern}).`);
  }

  if (!positives.length) {
    positives.push("No major positive factor has been confirmed yet.");
  }

  return positives;
}

function renderList(items) {

  return items
    .map(x => `<li>${esc(x)}</li>`)
    .join("");
}

function renderNews(news) {

  if (!news || !news.length) {
    return `<div class="metric-small">
      No recent news available.
    </div>`;
  }

  return news.map(item => {

    const title = esc(item.title);
    const source = esc(item.source);
    const sentiment = esc(item.sentiment);

    if (item.url) {
      return `
        <div class="news-item">
          <a href="${esc(item.url)}" target="_blank" rel="noopener">
            ${title}
          </a>
          <div class="news-source">
            ${source} · ${sentiment}
          </div>
        </div>
      `;
    }

    return `
      <div class="news-item">
        <div><strong>${title}</strong></div>
        <div class="news-source">
          ${source} · ${sentiment}
        </div>
      </div>
    `;

  }).join("");
}

function render(d) {

  currentData = d;

  const decisionClass =
    classForDecision(d.decision);

  const positives =
    buildPositives(d);

  const risks =
    buildRisks(d);

  const healthScore =
    Number(d.company_health?.score || 0);

  const revenueGrowth =
    d.growth?.revenue_growth;

  const profitGrowth =
    d.growth?.profit_growth;

  const epsGrowth =
    d.growth?.eps_growth;

  document.getElementById("app").innerHTML = `

    <!-- HERO -->

    <div class="card">

      <div class="hero">

        <div>

          <div class="section-title">
            INVESTMENT OVERVIEW
          </div>

          <h2 style="margin:0;font-size:28px;">
            ${esc(d.symbol)}
          </h2>

          <div class="company-name">
            ${esc(d.name || d.symbol)}
          </div>

          <div class="price">
            ${money(d.price)}
          </div>

          <div class="change ${valueClass(d.change_pct)}">
            ${d.change_pct >= 0 ? "+" : ""}
            ${percent(d.change_pct)}
          </div>

        </div>

        <div class="hero-right">

          <div class="decision ${decisionClass}">
            ${esc(d.decision)}
          </div>

          <div class="score">
            Investment Score<br>
            <strong>${d.score ?? "N/A"}/100</strong>
          </div>

        </div>

      </div>

    </div>


    <!-- INVESTOR VIEW -->

    <div class="card">

      <div class="section-title">
        INVESTOR VIEW
      </div>

      <div class="investor-summary">
        ${esc(investorSummary(d))}
      </div>

    </div>


    <!-- COMPANY HEALTH -->

    <div class="card">

      <div class="section-title">
        COMPANY HEALTH
      </div>

      <div class="grid">

        <div>

          <div class="health-score">
            ${healthScore}/100
          </div>

          <div class="health-status ${trendClass(d.company_health?.status)}">
            ${esc(d.company_health?.status || "N/A")}
          </div>

          <div class="progress">
            <div
              class="progress-inner"
              style="width:${Math.max(0,Math.min(100,healthScore))}%">
            </div>
          </div>

          <div class="metric-small" style="margin-top:10px;">
            Business health combines growth, profitability,
            valuation and supporting market evidence.
          </div>

        </div>

        <div class="grid">

          <div class="metric">
            <div class="metric-label">SECTOR</div>
            <div class="metric-value">
              ${esc(d.sector)}
            </div>
          </div>

          <div class="metric">
            <div class="metric-label">INDUSTRY</div>
            <div class="metric-value">
              ${esc(d.industry)}
            </div>
          </div>

        </div>

      </div>

    </div>


    <!-- GROWTH -->

    <div class="card">

      <div class="section-title">
        GROWTH
      </div>

      <div class="grid3">

        <div class="metric">
          <div class="metric-label">GROWTH QUALITY</div>
          <div class="metric-value ${trendClass(d.growth?.trend)}">
            ${esc(d.growth?.trend || "N/A")}
          </div>
        </div>

        <div class="metric">
          <div class="metric-label">REVENUE GROWTH</div>
          <div class="metric-value ${valueClass(revenueGrowth)}">
            ${percent(revenueGrowth)}
          </div>
        </div>

        <div class="metric">
          <div class="metric-label">PROFIT GROWTH</div>
          <div class="metric-value ${valueClass(profitGrowth)}">
            ${percent(profitGrowth)}
          </div>
        </div>

      </div>

      <div class="metric" style="margin-top:12px;">
        <div class="metric-label">EPS GROWTH</div>
        <div class="metric-value ${valueClass(epsGrowth)}">
          ${percent(epsGrowth)}
        </div>
      </div>

    </div>


    <!-- PROFITABILITY -->

    <div class="card">

      <div class="section-title">
        PROFITABILITY
      </div>

      <div class="grid3">

        <div class="metric">
          <div class="metric-label">PROFITABILITY</div>
          <div class="metric-value ${trendClass(d.profitability?.trend)}">
            ${esc(d.profitability?.trend || "N/A")}
          </div>
        </div>

        <div class="metric">
          <div class="metric-label">PROFIT MARGIN</div>
          <div class="metric-value">
            ${percent(d.profitability?.profit_margin)}
          </div>
        </div>

        <div class="metric">
          <div class="metric-label">OPERATING MARGIN</div>
          <div class="metric-value">
            ${percent(d.profitability?.operating_margin)}
          </div>
        </div>

      </div>

      <div class="metric" style="margin-top:12px;">
        <div class="metric-label">RETURN ON EQUITY</div>
        <div class="metric-value">
          ${percent(d.profitability?.roe)}
        </div>
      </div>

    </div>


    <!-- VALUATION -->

    <div class="card">

      <div class="section-title">
        VALUATION
      </div>

      <div class="grid3">

        <div class="metric">
          <div class="metric-label">VALUATION VIEW</div>
          <div class="metric-value ${trendClass(d.valuation?.view)}">
            ${esc(d.valuation?.view || "N/A")}
          </div>
        </div>

        <div class="metric">
          <div class="metric-label">P/E</div>
          <div class="metric-value">
            ${multiple(d.valuation?.pe)}
          </div>
        </div>

        <div class="metric">
          <div class="metric-label">PEG</div>
          <div class="metric-value">
            ${multiple(d.valuation?.peg)}
          </div>
        </div>

      </div>

      <div class="metric" style="margin-top:12px;">
        <div class="metric-label">EPS</div>
        <div class="metric-value">
          ${money(d.valuation?.eps)}
        </div>
      </div>

    </div>


    <!-- NEWS -->

    <div class="card">

      <div class="section-title">
        LATEST NEWS
      </div>

      <div class="metric" style="margin-bottom:12px;">
        <div class="metric-label">NEWS SENTIMENT</div>
        <div class="metric-value ${trendClass(d.news_sentiment)}">
          ${esc(d.news_sentiment || "N/A")}
        </div>
      </div>

      ${renderNews(d.news)}

    </div>


    <!-- ENTRY -->

    <div class="card">

      <div class="section-title">
        PRICE & ENTRY
      </div>

      <div class="entry-highlight">

        <div class="metric-label">
          PREFERRED BUY ZONE
        </div>

        <div class="entry-price">
          ${money(d.entry_low)}
          –
          ${money(d.entry_high)}
        </div>

        <div class="metric-small">
          Preferred entry:
          <strong>${money(d.preferred_entry)}</strong>
        </div>

      </div>

      <div class="grid3" style="margin-top:12px;">

        <div class="metric">
          <div class="metric-label">INVALIDATION</div>
          <div class="metric-value bad">
            ${money(d.invalidation)}
          </div>
        </div>

        <div class="metric">
          <div class="metric-label">TARGET 1</div>
          <div class="metric-value good">
            ${money(d.target1)}
          </div>
        </div>

        <div class="metric">
          <div class="metric-label">TARGET 2</div>
          <div class="metric-value good">
            ${money(d.target2)}
          </div>
        </div>

      </div>

      <div class="grid" style="margin-top:12px;">

        <div class="metric">
          <div class="metric-label">
            RISK / REWARD → TARGET 1
          </div>
          <div class="rr ${trendClass(d.risk_reward_quality)}">
            ${multiple(d.risk_reward_target1)}
          </div>
        </div>

        <div class="metric">
          <div class="metric-label">
            RISK / REWARD → TARGET 2
          </div>
          <div class="rr ${trendClass(d.risk_reward_quality)}">
            ${multiple(d.risk_reward_target2)}
          </div>
        </div>

      </div>

      <div class="metric-small" style="margin-top:12px;">

          d.in_pullback_zone
          ? "✓ Price is currently inside the preferred pullback zone."
          : "Waiting for price to reach the preferred entry zone."
        }
      </div>

    </div>


    <!-- POSITIVES & RISKS -->

    <div class="grid">

      <div class="card positive-box">

        <div class="section-title">
          WHAT I LIKE
        </div>

        <ul>
          ${renderList(positives)}
        </ul>

      </div>


      <div class="card risk-box">

        <div class="section-title">
          WHAT COULD GO WRONG
        </div>

        <ul>
          ${renderList(risks)}
        </ul>

      </div>

    </div>


    <!-- CHART -->

    <div class="card">

      <div class="section-title">
        PRICE & DECISION MAP
      </div>

      <div class="chart-wrap">
        <canvas id="priceChart"></canvas>
      </div>

      <div class="chart-legend">

        <div class="legend">
          <span class="dot"></span>
          Price
        </div>

        <div class="legend">
          🟢 Buy zone
        </div>

        <div class="legend">
          🟠 Resistance
        </div>

        <div class="legend">
          🔴 Invalidation
        </div>

        <div class="legend">
          🎯 Target 1 / Target 2
        </div>

      </div>

    </div>


    <!-- TECHNICALS -->

    <div class="card">

      <details>

        <summary>
          Technical Analysis
        </summary>

        <div class="grid3" style="margin-top:16px;">

          <div class="metric">
            <div class="metric-label">TREND</div>
            <div class="metric-value ${trendClass(d.trend)}">
              ${esc(d.trend)}
            </div>
          </div>

          <div class="metric">
            <div class="metric-label">STRUCTURE</div>
            <div class="metric-value" style="font-size:14px;">
              ${esc(d.structure)}
            </div>
          </div>

          <div class="metric">
            <div class="metric-label">TECHNICAL SCORE</div>
            <div class="metric-value">
              ${d.technical_score ?? "N/A"}/100
            </div>
          </div>

          <div class="metric">
            <div class="metric-label">SMA 20</div>
            <div class="metric-value">
              ${money(d.sma20)}
            </div>
          </div>

          <div class="metric">
            <div class="metric-label">SMA 50</div>
            <div class="metric-value">
              ${money(d.sma50)}
            </div>
          </div>

          <div class="metric">
            <div class="metric-label">RSI 14</div>
            <div class="metric-value">
              ${d.rsi ?? "N/A"}
            </div>
          </div>

          <div class="metric">
            <div class="metric-label">MACD</div>
            <div class="metric-value">
              ${d.macd ?? "N/A"}
            </div>
          </div>

          <div class="metric">
            <div class="metric-label">SUPPORT</div>
            <div class="metric-value">
              ${money(d.support)}
            </div>
          </div>

          <div class="metric">
            <div class="metric-label">RESISTANCE</div>
            <div class="metric-value">
              ${money(d.resistance)}
            </div>
          </div>

        </div>

        <div style="margin-top:18px;">

          <div class="section-title">
            CHART FORMATIONS
          </div>

          ${
            d.formations?.length
              ? d.formations.map(f => `
                <div class="metric" style="margin-bottom:8px;">
                  <strong>${esc(f.name)}</strong>
                  <span class="${trendClass(f.direction)}">
                    · ${esc(f.direction)}
                  </span>
                  <div class="metric-small">
                    Confidence ${f.confidence}%
                  </div>
                </div>
              `).join("")
              : `<div class="metric-small">
                   No significant formation detected.
                 </div>`
          }

        </div>

        <div style="margin-top:18px;">

          <div class="section-title">
            CANDLE SIGNAL

          <div class="metric">
            <div class="metric-value">
              ${esc(d.candle_pattern || "None")}
            </div>
            <div class="metric-small">
              Strength: ${esc(d.candle_strength || "N/A")}
            </div>
          </div>

        </div>

      </details>

    </div>


    <div class="footer">
      Daily market data: ${esc(d.last_updated || "N/A")}
    </div>
  `;

  drawChart(d);

}

function drawChart(d) {

  const canvas =
    document.getElementById("priceChart");

  if (!canvas) return;

  const ctx =
    canvas.getContext("2d");

  const rect =
    canvas.getBoundingClientRect();

  const ratio =
    window.devicePixelRatio || 1;

  canvas.width =
    rect.width * ratio;

  canvas.height =
    rect.height * ratio;

  ctx.scale(ratio, ratio);

  const width = rect.width;
  const height = rect.height;

  const history =
    (d.history || []).slice(-60);

  if (history.length < 2) return;

  const prices =
    history.map(x => Number(x.close));

  const levels = [
    Number(d.entry_low),
    Number(d.entry_high),
    Number(d.invalidation),
    Number(d.resistance),
    Number(d.target1),
    Number(d.target2)
  ].filter(Number.isFinite);

  const all =
    prices.concat(levels);

  let min =
    Math.min(...all);

  let max =
    Math.max(...all);

  const padding =
    (max - min) * 0.12 || 1;

  min -= padding;
  max += padding;

  const left = 15;
  const right = 15;
  const top = 15;
  const bottom = 25;

  const chartWidth =
    width - left - right;

  const chartHeight =
    height - top - bottom;

  function x(i) {
    return left +
      (i / (prices.length - 1)) *
      chartWidth;
  }

  function y(value) {
    return top +
      (1 - (value - min) / (max - min)) *
      chartHeight;
  }

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  /*
    Background grid
  */

  ctx.strokeStyle = "#e8edf4";
  ctx.lineWidth = 1;

  for (let i = 0; i < 5; i++) {

    const gy =
      top +
      (i / 4) * chartHeight;

    ctx.beginPath();
    ctx.moveTo(left, gy);
    ctx.lineTo(width - right, gy);
    ctx.stroke();

  }

  /*
    BUY ZONE
  */

  const zoneLow =
    Number(d.entry_low);

  const zoneHigh =
    Number(d.entry_high);

  if (
    Number.isFinite(zoneLow) &&
    Number.isFinite(zoneHigh)
  ) {

    const yHigh =
      y(Math.max(zoneLow, zoneHigh));

    const yLow =
      y(Math.min(zoneLow, zoneHigh));

    ctx.fillStyle =
      "rgba(70,150,100,0.10)";

    ctx.fillRect(
      left,
      yHigh,
      chartWidth,
      yLow - yHigh
    );

  }

  function drawLevel(
    value,
    lineType,
    label
  ) {

    if (!Number.isFinite(value)) return;

    const yy = y(value);

    ctx.save();

    if (lineType === "dashed") {
      ctx.setLineDash([6, 5]);
    } else {
      ctx.setLineDash([]);
    }

    ctx.strokeStyle =
      lineType === "risk"
        ? "#c94b4b"
        : lineType === "target"
          ? "#4b8f63"
          : "#bd8735";

    ctx.lineWidth = 1.3;

    ctx.beginPath();
    ctx.moveTo(left, yy);
    ctx.lineTo(width - right, yy);
    ctx.stroke();

    ctx.restore();

    ctx.fillStyle =
      "#66748b";

    ctx.font =
      "11px -apple-system, BlinkMacSystemFont, sans-serif";

    ctx.fillText(
      label + " " + money(value),
      left + 5,
      Math.max(12, yy - 4)
    );

  }

  drawLevel(
    d.invalidation,
    "risk",
    "Invalidation"
  );

  drawLevel(
    d.resistance,
    "dashed",
    "Resistance"
  );

  drawLevel(
    d.target1,
    "target",
    "Target 1"
  );

  drawLevel(
    d.target2,
    "target",
    "Target 2"
  );

  /*
    PRICE LINE
  */

  ctx.strokeStyle =
    "#172033";

  ctx.lineWidth = 3;

  ctx.beginPath();

  prices.forEach((price, i) => {

    const px = x(i);
    const py = y(price);

    if (i === 0) {
      ctx.moveTo(px, py);
    } else {
      ctx.lineTo(px, py);
    }

  });

  ctx.stroke();

  /*
    CURRENT PRICE
  */

  const current =
    prices[prices.length - 1];

  const cx =
    x(prices.length - 1);

  const cy =
    y(current);

  ctx.fillStyle =
    "#172033";

  ctx.beginPath();
  ctx.arc(cx, cy, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.font =
    "bold 12px -apple-system, BlinkMacSystemFont, sans-serif";

  ctx.fillText(
    money(current),
    Math.max(5, cx - 55),
    cy - 10
  );

}

async function analyze() {

  const input =
    document.getElementById("tickerInput");

  const symbol =
    String(
      input.value || currentTicker
    )
      .trim()
      .toUpperCase();

  if (!symbol) return;

  currentTicker = symbol;

  document.getElementById("app").innerHTML =
    `<div class="card loading">
      Analyzing ${esc(symbol)}...
      <br><br>
      <small>
        Gathering market, company and news data.
      </small>
    </div>`;

  document.querySelectorAll(".ticker")
    .forEach(btn => {
      btn.classList.toggle(
        "active",
        btn.textContent.trim() === symbol
      );
    });

  try {

    const response =
      await fetch(
        `/api/stock?ticker=${encodeURIComponent(symbol)}`
      );

    const data =
      await response.json();

    if (!response.ok || data.error) {

      throw new Error(
        data.error ||
        "Unable to load investment data."
      );

    }

    render(data);

  } catch (error) {

    document.getElementById("app").innerHTML =
      `<div class="error">
        <strong>Error</strong><br><br>
        ${esc(error.message)}
      </div>`;

  }

}

function selectTicker(symbol) {

  currentTicker = symbol;

  document.getElementById("tickerInput").value =
    symbol;

  analyze();

}

window.addEventListener(
  "resize",
  () => {
    if (currentData) {
      drawChart(currentData);
    }
  }
);

document.getElementById("tickerInput")
  .addEventListener(
    "keydown",
    e => {
      if (e.key === "Enter") {
        analyze();
      }
    }
  );

analyze();

</script>
