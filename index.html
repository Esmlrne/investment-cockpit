<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
/>

<title>Investment Cockpit</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  background: #f5f6f8;

  color: #17191c;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

}

.container {

  max-width: 1200px;

  margin: auto;

  padding: 18px;

}

.header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 12px;

  margin-bottom: 18px;

}

h1 {

  margin: 0;

  font-size: 28px;

}

.subtitle {

  color: #6b7078;

  font-size: 13px;

  margin-top: 4px;

}

button {

  border: 0;

  border-radius: 10px;

  padding: 11px 15px;

  font-weight: 700;

  cursor: pointer;

}

.primary {

  background: #111;

  color: white;

}

.search-row {

  display: flex;

  gap: 8px;

  margin-bottom: 14px;

}

.search-row input {

  flex: 1;

  min-width: 0;

  border: 1px solid #d5d8dd;

  border-radius: 10px;

  padding: 12px;

  font-size: 16px;

  background: white;

}

.watchlist {

  display: flex;

  flex-wrap: wrap;

  gap: 8px;

  margin-bottom: 18px;

}

.ticker {

  background: white;

  border: 1px solid #ddd;

  border-radius: 20px;

  padding: 8px 12px;

  font-weight: 700;

  cursor: pointer;

}

.ticker.active {

  background: #111;

  color: white;

}

.card {

  background: white;

  border-radius: 16px;

  padding: 18px;

  margin-bottom: 16px;

  box-shadow:
    0 2px 10px rgba(0,0,0,.05);

}

.loading {

  text-align: center;

  padding: 35px;

  color: #666;

}

.error {

  background: #fff0f0;

  color: #a00000;

  border: 1px solid #ffcaca;

  padding: 14px;

  border-radius: 12px;

  margin-bottom: 16px;

}

.stock-header {

  display: flex;

  justify-content: space-between;

  align-items: flex-start;

  gap: 15px;

}

.symbol {

  font-size: 30px;

  font-weight: 800;

}

.company {

  color: #70757d;

  margin-top: 2px;

}

.price {

  font-size: 30px;

  font-weight: 800;

  text-align: right;

}

.change {

  text-align: right;

  font-weight: 700;

  margin-top: 3px;

}

.positive {
  color: #16833a;
}

.negative {
  color: #c62828;
}

.neutral {
  color: #777;
}

.grid {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 10px;

  margin-top: 18px;

}

.metric {

  background: #f7f7f8;

  border-radius: 12px;

  padding: 12px;

}

.metric-label {

  color: #70757d;

  font-size: 12px;

  margin-bottom: 5px;

}

.metric-value {

  font-size: 16px;

  font-weight: 800;

}

.section-title {

  font-size: 19px;

  font-weight: 800;

  margin-bottom: 14px;

}

.decision {

  border: 1px solid #ddd;

  border-radius: 14px;

  padding: 16px;

  background: #fafafa;

}

.decision-main {

  display: flex;

  justify-content: space-between;

  gap: 15px;

  align-items: center;

  margin-bottom: 15px;

}

.decision-label {

  color: #666;

  font-size: 12px;

  text-transform: uppercase;

  letter-spacing: .05em;

}

.decision-value {

  font-size: 22px;

  font-weight: 900;

  margin-top: 4px;

}

.badge {

  display: inline-block;

  border-radius: 20px;

  padding: 7px 11px;

  font-size: 12px;

  font-weight: 800;

  background: #eee;

}

.good {

  background: #e4f5e9;

  color: #176b32;

}

.warn {

  background: #fff2d8;

  color: #8a5a00;

}

.bad {

  background: #fde7e7;

  color: #a40000;

}

.conditions {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 8px;

  margin-top: 14px;

}

.condition {

  padding: 10px;

  background: white;

  border-radius: 9px;

  font-size: 13px;

}

.condition.yes {

  color: #176b32;

}

.condition.no {

  color: #a40000;

}

.logic {

  margin-top: 14px;

  padding: 12px;

  border-radius: 10px;

  background: white;

  color: #555;

  font-size: 13px;

  line-height: 1.5;

}

.strategy-grid {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 14px;

}

.strategy {

  border: 1px solid #ddd;

  border-radius: 14px;

  padding: 16px;

}

.strategy h3 {

  margin:
    0 0 12px;

  font-size: 17px;

}

.strategy-status {

  font-size: 18px;

  font-weight: 900;

  margin-bottom: 12px;

}

.strategy-table {

  width: 100%;

  border-collapse: collapse;

}

.strategy-table td {

  padding: 7px 0;

  border-bottom: 1px solid #eee;

  font-size: 13px;

}

.strategy-table td:last-child {

  text-align: right;

  font-weight: 800;

}

.pattern-grid {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 12px;

}

.pattern-card {

  border: 1px solid #ddd;

  border-radius: 14px;

  padding: 15px;

  background: #fafafa;

}

.pattern-name {

  font-size: 17px;

  font-weight: 900;

}

.pattern-type {

  color: #777;

  font-size: 11px;

  margin-top: 3px;

  text-transform: uppercase;

}

.pattern-confidence {

  font-size: 22px;

  font-weight: 900;

  margin-top: 12px;

}

.pattern-status {

  display: inline-block;

  margin-top: 7px;

  padding: 5px 8px;

  border-radius: 8px;

  background: #eee;

  font-size: 11px;

  font-weight: 800;

}

.pattern-description {

  margin-top: 10px;

  color: #555;

  font-size: 13px;

  line-height: 1.45;

}

.chart-wrapper {

  width: 100%;

  overflow: hidden;

}

canvas {

  display: block;

  width: 100%;

  height: 420px;

  background: white;

  border-radius: 12px;

}

.legend {

  display: flex;

  flex-wrap: wrap;

  gap: 12px;

  margin-top: 10px;

  color: #666;

  font-size: 12px;

}

.legend span {

  display: flex;

  align-items: center;

  gap: 5px;

}

.dot {

  width: 9px;

  height: 9px;

  border-radius: 50%;

  display: inline-block;

}

.analysis-grid {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 14px;

}

.list {

  margin: 0;

  padding-left: 20px;

}

.list li {

  margin-bottom: 7px;

  font-size: 14px;

  line-height: 1.4;

}

.footer {

  text-align: center;

  color: #888;

  font-size: 11px;

  padding:
    10px 0 25px;

}

@media (max-width: 750px) {

  .container {
    padding: 12px;
  }

  h1 {
    font-size: 23px;
  }

  .grid {
    grid-template-columns:
      repeat(2, 1fr);
  }

  .strategy-grid,
  .analysis-grid,
  .pattern-grid {
    grid-template-columns: 1fr;
  }

  .conditions {
    grid-template-columns: 1fr;
  }

  .stock-header {
    flex-direction: column;
  }

  .price,
  .change {
    text-align: left;
  }

  canvas {
    height: 390px;
  }

}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <div>

      <h1>Investment Cockpit</h1>

      <div class="subtitle">
        Technical analysis • Chart formations • Decision engine
      </div>

    </div>

    <button
      class="primary"
      onclick="loadStock(currentTicker)"
    >
      Refresh
    </button>

  </div>


  <div class="search-row">

    <input
      id="tickerInput"
      placeholder="Add ticker e.g. NVDA"
      autocomplete="off"
      autocapitalize="characters"
    >

    <button
      class="primary"
      onclick="addTicker()"
    >
      Add
    </button>

  </div>


  <div
    id="watchlist"
    class="watchlist"
  ></div>


  <div id="error"></div>

  <div id="content"></div>


  <div class="footer">
    Investment Cockpit • Technical signals are decision support, not financial advice.
  </div>

</div>


<script>

let tickers = [
  "AAPL",
  "NVDA",
  "MSFT"
];

let currentTicker = "AAPL";

let currentData = null;

const watchlistEl =
  document.getElementById(
    "watchlist"
  );

const contentEl =
  document.getElementById(
    "content"
  );

const errorEl =
  document.getElementById(
    "error"
  );


function money(v) {

  if (
    v === null ||
    v === undefined ||
    !isFinite(v)
  ) return "—";

  return "$" +
    Number(v).toFixed(2);

}


function num(v, digits = 2) {

  if (
    v === null ||
    v === undefined ||
    !isFinite(v)
  ) return "—";

  return Number(v).toFixed(digits);

}


function pct(v) {

  if (
    v === null ||
    v === undefined ||
    !isFinite(v)
  ) return "—";

  const n =
    Number(v);

  return (
    n >= 0 ? "+" : ""
  ) +
  n.toFixed(2) +
  "%";

}


function esc(value) {

  return String(
    value ?? ""
  )
  .replace(/&/g, "&amp;")
  .replace(/</g, "&lt;")
  .replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");

}


function renderWatchlist() {

  watchlistEl.innerHTML =
    tickers.map(t => `

      <div
        class="ticker ${
          t === currentTicker
            ? "active"
            : ""
        }"
        onclick="loadStock('${esc(t)}')"
      >
        ${esc(t)}
      </div>

    `).join("");

}


function addTicker() {

  const input =
    document.getElementById(
      "tickerInput"
    );

  const ticker =
    input.value
      .trim()
      .toUpperCase();

  if (!ticker) return;

  if (!tickers.includes(ticker)) {
    tickers.push(ticker);
  }

  input.value = "";

  loadStock(ticker);

}


document
  .getElementById("tickerInput")
  .addEventListener(
    "keydown",
    e => {

      if (e.key === "Enter") {
        addTicker();
      }

    }
  );


async function loadStock(ticker) {

  currentTicker = ticker;

  renderWatchlist();

  errorEl.innerHTML = "";

  contentEl.innerHTML = `

    <div class="card loading">
      Loading ${esc(ticker)}...
    </div>

  `;

  try {

    const response =
      await fetch(
        "/api/stock?ticker=" +
        encodeURIComponent(ticker)
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Unable to load stock."
      );

    }

    currentData = data;

    renderDashboard(data);

  } catch (err) {

    errorEl.innerHTML = `

      <div class="error">

        <strong>Error:</strong>
        ${esc(err.message)}

      </div>

    `;

    contentEl.innerHTML = "";

  }

}


function renderDashboard(data) {

  const changeClass =
    Number(data.change_pct) > 0
      ? "positive"
      : Number(data.change_pct) < 0
      ? "negative"
      : "neutral";


  contentEl.innerHTML = `

    <div class="card">

      <div class="stock-header">

        <div>

          <div class="symbol">
            ${esc(data.symbol)}
          </div>

          <div class="company">
            ${esc(data.name || "")}
          </div>

        </div>


        <div>

          <div class="price">
            ${money(data.price)}
          </div>

          <div
            class="change ${changeClass}"
          >
            ${pct(data.change_pct)}
          </div>

        </div>

      </div>


      <div class="grid">

        ${metric(
          "Signal",
          data.signal
        )}

        ${metric(
          "Score",
          num(data.score, 0) + "/100"
        )}

        ${metric(
          "Trend",
          data.trend
        )}

        ${metric(
          "Trend Confidence",
          num(data.trend_confidence, 0) + "%"
        )}

        ${metric(
          "RSI",
          num(data.rsi)
        )}

        ${metric(
          "SMA 20",
          money(data.fundamentals?.sma20)
        )}

        ${metric(
          "SMA 50",
          money(data.fundamentals?.sma50)
        )}

        ${metric(
          "Structure",
          data.structure
        )}

        ${metric(
          "Candle Pattern",
          data.candle_pattern
        )}

        ${metric(
          "Candle Signal",
          data.candle_signal
        )}

        ${metric(
          "Candle Strength",
          data.candle_strength
        )}

        ${metric(
          "Volume",
          num(data.relative_volume) + "x"
        )}

      </div>


      <div class="logic">

        <strong>
          Candle indication:
        </strong>

        <br>

        ${esc(
          data.candle_description ||
          "No specific candlestick indication detected."
        )}

      </div>

    </div>


    ${renderChartFormation(data)}


    ${renderDecisionCockpit(data)}


    ${renderStrategies(data)}


    <div class="card">

      <div class="section-title">
        Price & Technical Levels
      </div>

      <div class="chart-wrapper">

        <canvas id="priceChart"></canvas>

      </div>

      <div class="legend">

        <span>
          Price
        </span>

        <span>
          SMA20
        </span>

        <span>
          SMA50
        </span>

        <span>
          Pullback zone
        </span>

      </div>

    </div>


    ${renderAnalysis(data)}

  `;


  drawChart(data);

}


function metric(label, value) {

  return `

    <div class="metric">

      <div class="metric-label">
        ${esc(label)}
      </div>

      <div class="metric-value">
        ${esc(value ?? "—")}
      </div>

    </div>

  `;

}


/* ============================================================
   CHART FORMATIONS
   ============================================================ */

function renderChartFormation(data) {

  const patterns =
    Array.isArray(
      data.chart_patterns
    )
      ? data.chart_patterns
      : [];


  if (!patterns.length) {

    return `

      <div class="card">

        <div class="section-title">
          Chart Formations
        </div>

        <div class="logic">
          No major multi-day chart formation
          is currently detected.
        </div>

      </div>

    `;

  }


  return `

    <div class="card">

      <div class="section-title">
        Chart Formations
      </div>

      <div class="pattern-grid">

        ${
          patterns.map(
            pattern => `

              <div class="pattern-card">

                <div class="pattern-name">
                  ${esc(pattern.name)}
                </div>

                <div class="pattern-type">
                  ${esc(pattern.type)}
                </div>

                <div class="pattern-confidence">

                  ${num(
                    pattern.confidence,
                    0
                  )}%

                </div>

                <div class="pattern-status">

                  ${esc(
                    pattern.status
                  )}

                </div>


                <table
                  class="strategy-table"
                  style="margin-top:10px"
                >

                  <tr>

                    <td>
                      Trigger
                    </td>

                    <td>
                      ${money(
                        pattern.trigger
                      )}
                    </td>

                  </tr>

                  <tr>

                    <td>
                      Target
                    </td>

                    <td>
                      ${money(
                        pattern.target
                      )}
                    </td>

                  </tr>

                </table>


                <div class="pattern-description">

                  ${esc(
                    pattern.description
                  )}

                </div>

              </div>

            `
          ).join("")
        }

      </div>

      <div class="logic">

        <strong>
          How to read this:
        </strong>

        A chart formation is a
        <strong>probability setup</strong>,
        not a guaranteed prediction.
        The confidence score measures how closely
        recent price structure resembles the formation.
        Breakout or breakdown confirmation is still required.

      </div>

    </div>

  `;

}


/* ============================================================
   DECISION COCKPIT
   ============================================================ */

function renderDecisionCockpit(data) {

  const confirmed =
    !!data.buy_trigger_confirmed;

  const conditions =
    Array.isArray(
      data.buy_condition_labels
    )
      ? data.buy_condition_labels
      : [];

  const states =
    Array.isArray(
      data.buy_conditions
    )
      ? data.buy_conditions
      : [];

  const rrQuality =
    data.risk_reward_quality ||
    "—";

  const rrClass =
    rrQuality === "ATTRACTIVE"
      ? "good"
      : rrQuality === "NOT ATTRACTIVE"
      ? "bad"
      : "warn";


  return `

    <div class="card">

      <div class="section-title">
        Decision Cockpit
      </div>

      <div class="decision">

        <div class="decision-main">

          <div>

            <div class="decision-label">
              Buy trigger
            </div>

            <div class="decision-value">
              ${esc(
                data.buy_trigger ||
                "WAIT"
              )}
            </div>

            <div
              style="
                margin-top:5px;
                color:#666;
                font-size:13px;
              "
            >

              Trigger price:
              <strong>
                ${money(
                  data.buy_trigger_price
                )}
              </strong>

            </div>

          </div>


          <span
            class="badge ${
              confirmed
                ? "good"
                : "warn"
            }"
          >

            ${
              confirmed
                ? "CONFIRMED"
                : "WAIT"
            }

          </span>

        </div>


        <div class="grid">

          ${metric(
            "Invalidation",
            money(
              data.invalidation ||
              data.stop
            )
          )}

          ${metric(
            "Risk / Share",
            money(
              data.risk_per_share
            )
          )}

          ${metric(
            "Target 1",
            money(data.target1)
          )}

          ${metric(
            "Target 2",
            money(data.target2)
          )}

          ${metric(
            "R/R → T1",
            num(
              data.risk_reward_target1
            ) + "x"
          )}

          ${metric(
            "R/R → T2",
            num(
              data.risk_reward_target2
            ) + "x"
          )}

          <div class="metric">

            <div class="metric-label">
              R/R Quality
            </div>

            <div class="metric-value">

              <span
                class="badge ${rrClass}"
              >
                ${esc(rrQuality)}
              </span>

            </div>

          </div>

          ${metric(
            "Confirmation",
            `${data.conditions_met || 0}/${
              data.conditions_total || 0
            }`
          )}

        </div>


        <div class="logic">

          <strong>
            Trigger logic:
          </strong>

          <br>

          ${esc(
            data.trigger_reason ||
            "Wait for confirmation."
          )}

        </div>


        <div class="logic">

          <strong>
            Invalidation logic:
          </strong>

          <br>

          ${esc(
            data.invalidation_reason ||
            "Setup is invalidated below structural support."
          )}

        </div>


        <div
          class="conditions"
        >

          ${
            conditions.map(
              (label, i) => `

                <div
                  class="
                    condition
                    ${
                      states[i]
                        ? "yes"
                        : "no"
                    }
                  "
                >

                  ${
                    states[i]
                      ? "✓"
                      : "✕"
                  }

                  ${esc(label)}

                </div>

              `
            ).join("")
          }

        </div>

      </div>

    </div>

  `;

}


/* ============================================================
   STRATEGIES
   ============================================================ */

function renderStrategies(data) {

  const price =
    Number(data.price);

  const support =
    Number(
      data.fundamentals?.support ??
      data.entry_low ??
      data.stop
    );

  const resistance =
    Number(
      data.fundamentals?.resistance ??
      data.entry_high
    );

  const sma20 =
    Number(
      data.fundamentals?.sma20
    );

  const invalidation =
    Number(
      data.invalidation ??
      data.stop ??
      support
    );

  const target1 =
    Number(data.target1);

  const target2 =
    Number(data.target2);


  const zoneLow =
    isFinite(support)
      ? support
      : price * 0.95;


  let zoneHigh;

  if (
    isFinite(sma20) &&
    sma20 > zoneLow
  ) {

    zoneHigh =
      Math.min(
        sma20,
        zoneLow +
          Math.max(
            price * 0.06,
            (
              resistance -
              zoneLow
            ) * 0.35
          )
      );

  } else {

    zoneHigh =
      zoneLow +
      price * 0.05;

  }


  if (
    !isFinite(zoneHigh) ||
    zoneHigh <= zoneLow
  ) {

    zoneHigh =
      zoneLow * 1.04;

  }


  const bestEntry =
    zoneLow +
    (zoneHigh - zoneLow) *
    0.25;

  const baseEntry =
    zoneLow +
    (zoneHigh - zoneLow) *
    0.50;

  const worstEntry =
    zoneLow +
    (zoneHigh - zoneLow) *
    0.75;


  function rr(entry, target) {

    const risk =
      entry - invalidation;

    const reward =
      target - entry;

    if (
      !isFinite(risk) ||
      risk <= 0
    ) return null;

    return reward / risk;

  }


  const bestRR1 =
    rr(bestEntry, target1);

  const baseRR1 =
    rr(baseEntry, target1);

  const worstRR1 =
    rr(worstEntry, target1);

  const bestRR2 =
    rr(bestEntry, target2);

  const baseRR2 =
    rr(baseEntry, target2);

  const worstRR2 =
    rr(worstEntry, target2);


  let status =
    "WAIT FOR PULLBACK";

  let strategy =
    "WAIT FOR PULLBACK";


  if (price < zoneLow) {

    status =
      "PULLBACK INVALIDATED";

    strategy =
      "AVOID";

  } else if (
    price >= zoneLow &&
    price <= zoneHigh
  ) {

    status =
      "IN PULLBACK ZONE";

    if (
      baseRR1 !== null &&
      baseRR1 >= 2 &&
      data.short_term_trend ===
        "BULLISH"
    ) {

      strategy =
        "PULLBACK OPPORTUNITY";

    } else {

      strategy =
        "WAIT FOR CONFIRMATION";

    }

  } else {

    status =
      "ABOVE PULLBACK ZONE";

    strategy =
      "WAIT FOR PULLBACK";

  }


  const breakoutTrigger =

/* ============================================================
   CHART
   ============================================================ */

function drawChart(data) {

  const canvas =
    document.getElementById(
      "priceChart"
    );

  if (!canvas) return;

  const ctx =
    canvas.getContext("2d");

  const rect =
    canvas.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    rect.width * dpr;

  canvas.height =
    rect.height * dpr;

  ctx.scale(dpr, dpr);

  const W =
    rect.width;

  const H =
    rect.height;

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  const history =
    Array.isArray(data.history)
      ? data.history
      : [];


  if (history.length < 2) {

    ctx.fillStyle = "#777";

    ctx.font =
      "14px Arial";

    ctx.fillText(
      "Not enough historical data.",
      20,
      30
    );

    return;

  }


  const recent =
    history.slice(-80);


  const highs =
    recent
      .map(x => Number(x.high))
      .filter(isFinite);

  const lows =
    recent
      .map(x => Number(x.low))
      .filter(isFinite);


  let minPrice =
    Math.min(...lows);

  let maxPrice =
    Math.max(...highs);


  const current =
    Number(data.price);


  const support =
    Number(
      data.fundamentals?.support ??
      data.stop
    );

  const resistance =
    Number(
      data.fundamentals?.resistance
    );

  const target1 =
    Number(data.target1);

  const target2 =
    Number(data.target2);

  const stop =
    Number(
      data.invalidation ??
      data.stop
    );


  const candidates = [

    current,
    support,
    resistance,
    target1,
    target2,
    stop

  ].filter(
    x =>
      isFinite(x) &&
      x > 0
  );


  const range =
    Math.max(
      maxPrice - minPrice,
      current * 0.08
    );


  candidates.forEach(v => {

    if (
      v >=
        current - range * 0.7 &&
      v <=
        current + range * 0.7
    ) {

      minPrice =
        Math.min(
          minPrice,
          v
        );

      maxPrice =
        Math.max(
          maxPrice,
          v
        );

    }

  });


  const finalRange =
    Math.max(
      maxPrice - minPrice,
      current * 0.08
    );


  minPrice -=
    finalRange * 0.10;

  maxPrice +=
    finalRange * 0.10;


  if (
    minPrice <
    current * 0.55
  ) {

    minPrice =
      current * 0.55;

  }


  const pad = {

    top: 22,

    bottom: 30,

    left: 45,

    right: 125

  };


  const chartW =
    W -
    pad.left -
    pad.right;

  const chartH =
    H -
    pad.top -
    pad.bottom;


  function x(i) {

    return (
      pad.left +
      (
        i /
        (history.length - 1)
      ) *
      chartW
    );

  }


  function y(value) {

    return (
      pad.top +
      (
        maxPrice -
        value
      ) /
      (
        maxPrice -
        minPrice
      ) *
      chartH
    );

  }


  /* Grid */

  ctx.strokeStyle =
    "#eeeeee";

  ctx.lineWidth = 1;


  for (
    let i = 0;
    i <= 5;
    i++
  ) {

    const yy =
      pad.top +
      (i / 5) *
      chartH;


    ctx.beginPath();

    ctx.moveTo(
      pad.left,
      yy
    );

    ctx.lineTo(
      W - pad.right,
      yy
    );

    ctx.stroke();


    const value =
      maxPrice -
      (i / 5) *
      (
        maxPrice -
        minPrice
      );


    ctx.fillStyle =
      "#888";

    ctx.font =
      "11px Arial";

    ctx.fillText(
      money(value),
      3,
      yy + 4
    );

  }


  /* Pullback zone */

  if (
    isFinite(support)
  ) {

    const sma20 =
      Number(
        data.fundamentals?.sma20
      );

    let zoneHigh =
      isFinite(sma20) &&
      sma20 > support
        ? Math.min(
            sma20,
            support +
            Math.max(
              current * 0.06,
              (
                resistance -
                support
              ) * 0.35
            )
          )
        : support +
          current * 0.05;


    if (
      zoneHigh >
        minPrice &&
      support <
        maxPrice
    ) {

      const topY =
        y(
          Math.min(
            zoneHigh,
            maxPrice
          )
        );

      const bottomY =
        y(
          Math.max(
            support,
            minPrice
          )
        );


      ctx.fillStyle =
        "rgba(100,100,100,0.08)";


      ctx.fillRect(
        pad.left,
        topY,
        chartW,
        bottomY - topY
      );

    }

  }


  /* Price */

  ctx.beginPath();

  history.forEach(
    (item, i) => {

      const value =
        Number(item.close);

      if (!isFinite(value))
        return;

      const xx =
        x(i);

      const yy =
        y(value);


      if (i === 0) {

        ctx.moveTo(
          xx,
          yy
        );

      } else {

        ctx.lineTo(
          xx,
          yy
        );

      }

    }
  );


  ctx.strokeStyle =
    "#111";

  ctx.lineWidth = 2.2;

  ctx.stroke();


  /* SMA20 */

  drawIndicator(
    ctx,
    history,
    "sma20",
    x,
    y,
    "#777",
    1.4
  );


  /* SMA50 */

  drawIndicator(
    ctx,
    history,
    "sma50",
    x,
    y,
    "#aaa",
    1.3
  );


  /* Levels */

  const levels = [];


  function addLevel(
    label,
    value
  ) {

    if (
      !isFinite(value) ||
      value <= 0
    ) return;

    if (
      value <
        minPrice ||
      value >
        maxPrice
    ) return;


    levels.push({

      label,

      value,

      rawY: y(value)

    });

  }


  addLevel(
    "Resistance",
    resistance
  );

  addLevel(
    "Target 1",
    target1
  );

  addLevel(
    "Target 2",
    target2
  );

  addLevel(
    "Support",
    support
  );

  addLevel(
    "Invalidation",
    stop
  );

  addLevel(
    "Current",
    current
  );


  levels.sort(
    (a, b) =>
      a.rawY - b.rawY
  );


  const spacing =
    24;


  levels.forEach(
    (level, index) => {

      if (index === 0) {

        level.labelY =
          Math.max(
            pad.top + 10,
            level.rawY
          );

      } else {

        level.labelY =
          Math.max(
            level.rawY,
            levels[
              index - 1
            ].labelY +
            spacing
          );

      }

    }
  );


  levels.forEach(
    level => {

      const actualY =
        level.rawY;

      const labelY =
        level.labelY;


      ctx.strokeStyle =
        "#ddd";

      ctx.lineWidth = 1;

      ctx.setLineDash([
        4,
        4
      ]);


      ctx.beginPath();

      ctx.moveTo(
        pad.left,
        actualY
      );

      ctx.lineTo(
        W - pad.right,
        actualY
      );

      ctx.stroke();


      ctx.setLineDash([]);


      ctx.strokeStyle =
        "#bbb";


      ctx.beginPath();

      ctx.moveTo(
        W - pad.right,
        actualY
      );

      ctx.lineTo(
        W - pad.right + 8,
        labelY
      );

      ctx.stroke();


      ctx.fillStyle =
        "white";


      ctx.fillRect(
        W - pad.right + 10,
        labelY - 9,
        108,
        18
      );


      ctx.fillStyle =
        "#444";

      ctx.font =
        "11px Arial";


      ctx.fillText(
        level.label +
        " " +
        money(level.value),
        W - pad.right + 13,
        labelY + 4
      );

    }
  );


  /* Current marker */

  if (
    isFinite(current)
  ) {

    const cy =
      y(current);


    ctx.beginPath();

    ctx.arc(
      x(history.length - 1),
      cy,
      4,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "#111";

    ctx.fill();

  }


  /* Dates */

  ctx.fillStyle =
    "#888";

  ctx.font =
    "10px Arial";


  ctx.fillText(
    history[0].date,
    pad.left,
    H - 8
  );


  ctx.fillText(
    history[
      history.length - 1
    ].date,
    W - pad.right - 70,
    H - 8
  );

}


function drawIndicator(
  ctx,
  history,
  field,
  x,
  y,
  stroke,
  width
) {

  ctx.beginPath();

  let started =
    false;


  history.forEach(
    (item, i) => {

      const value =
        Number(item[field]);

      if (!isFinite(value))
        return;


      const xx =
        x(i);

      const yy =
        y(value);


      if (!started) {

        ctx.moveTo(
          xx,
          yy
        );

        started = true;

      } else {

        ctx.lineTo(
          xx,
          yy
        );

      }

    }
  );


  ctx.strokeStyle =
    stroke;

  ctx.lineWidth =
    width;

  ctx.stroke();

}


window.addEventListener(
  "resize",
  () => {

    if (currentData) {

      setTimeout(
        () =>
          drawChart(
            currentData
          ),
        100
      );

    }

  }
);


renderWatchlist();

loadStock(
