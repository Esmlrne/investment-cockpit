<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>Investment Cockpit</title>

<style>
:root{
  --bg:#0b0d12;
  --card:#141821;
  --card2:#10131a;
  --border:#252b36;
  --text:#f2f4f7;
  --muted:#8992a3;
  --green:#35d07f;
  --red:#ff5c67;
  --yellow:#f5c451;
  --blue:#55a7ff;
  --purple:#a88cff;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

main{
  max-width:900px;
  margin:auto;
  padding:18px 14px 50px;
}

h1{
  margin:4px 0;
  font-size:26px;
}

h2{
  margin:0;
  font-size:18px;
}

h3{
  margin:0;
}

.small{
  color:var(--muted);
  font-size:13px;
  line-height:1.4;
}

.search{
  display:flex;
  gap:8px;
  margin:18px 0 12px;
}

input{
  flex:1;
  min-width:0;
  background:var(--card);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:10px;
  padding:13px;
  font-size:16px;
}

button{
  background:#1d2430;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px 16px;
  font-size:15px;
  font-weight:600;
}

button:active{
  transform:scale(.98);
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:16px;
  margin-top:12px;
}

.hero{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}

.price{
  font-size:31px;
  font-weight:750;
  margin-top:4px;
}

.change{
  font-size:14px;
  margin-top:3px;
}

.badge{
  padding:7px 10px;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}

.bullish{
  background:rgba(53,208,127,.15);
  color:var(--green);
}

.bearish{
  background:rgba(255,92,103,.15);
  color:var(--red);
}

.sideways{
  background:rgba(245,196,81,.15);
  color:var(--yellow);
}

.neutral{
  background:rgba(137,146,163,.15);
  color:var(--muted);
}

.blue{
  background:rgba(85,167,255,.15);
  color:var(--blue);
}

.purple{
  background:rgba(168,140,255,.15);
  color:var(--purple);
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-top:14px;
}

.stat{
  background:var(--card2);
  border-radius:10px;
  padding:11px;
  min-width:0;
}

.stat .label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:4px;
}

.stat .value{
  font-size:15px;
  font-weight:650;
  word-break:break-word;
}

.chartWrap{
  width:100%;
  overflow:hidden;
}

canvas{
  display:block;
  width:100%;
  height:auto;
  background:#0e1117;
  border-radius:10px;
}

.chartTitle{
  margin:4px 0 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.analysis{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.analysisBox{
  background:var(--card2);
  border-radius:10px;
  padding:12px;
}

.analysisBox h3{
  margin:0 0 7px;
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
}

.analysisBox strong{
  font-size:16px;
}

.watchlist{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.tickerBtn{
  padding:9px 12px;
  font-size:13px;
}

.list{
  margin:8px 0 0;
  padding-left:18px;
}

.list li{
  margin:6px 0;
  font-size:13px;
  line-height:1.4;
}

/* DECISION COCKPIT */

.decision{
  border-color:#344052;
  background:
    linear-gradient(
      180deg,
      rgba(85,167,255,.07),
      rgba(20,24,33,1) 32%
    );
}

.decisionHeader{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.setup{
  font-size:21px;
  font-weight:800;
  margin-top:4px;
}

.triggerStatus{
  padding:8px 11px;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}

.triggerConfirmed{
  color:var(--green);
  background:rgba(53,208,127,.15);
}

.triggerWaiting{
  color:var(--yellow);
  background:rgba(245,196,81,.15);
}

.triggerDanger{
  color:var(--red);
  background:rgba(255,92,103,.15);
}

.decisionGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-top:14px;
}

.decisionBox{
  background:var(--card2);
  border-radius:11px;
  padding:12px;
}

.decisionBox .label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:5px;
}

.decisionBox .value{
  font-size:17px;
  font-weight:750;
}

.triggerBox{
  border:1px solid rgba(53,208,127,.28);
  background:rgba(53,208,127,.06);
}

.invalidationBox{
  border:1px solid rgba(255,92,103,.25);
  background:rgba(255,92,103,.05);
}

.rrBox{
  border:1px solid rgba(85,167,255,.25);
  background:rgba(85,167,255,.05);
}

.conditions{
  margin-top:14px;
}

.conditionsTitle{
  font-size:12px;
  font-weight:750;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:8px;
}

.condition{
  display:flex;
  align-items:flex-start;
  gap:9px;
  padding:9px 10px;
  margin:6px 0;
  background:var(--card2);
  border-radius:9px;
  font-size:13px;
  line-height:1.35;
}

.conditionIcon{
  width:20px;
  height:20px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex:0 0 20px;
  font-size:12px;
  font-weight:800;
}

.conditionMet .conditionIcon{
  color:var(--green);
  background:rgba(53,208,127,.15);
}

.conditionMissing .conditionIcon{
  color:var(--red);
  background:rgba(255,92,103,.15);
}

.conditionOptional .conditionIcon{
  color:var(--yellow);
  background:rgba(245,196,81,.15);
}

.reasonBox{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  background:var(--card2);
}

.reasonBox .label{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  margin-bottom:5px;
}

.reasonBox .text{
  font-size:13px;
  line-height:1.45;
}

.quality{
  display:inline-block;
  padding:5px 8px;
  border-radius:7px;
  font-size:11px;
  font-weight:800;
}

.qualityGood{
  color:var(--green);
  background:rgba(53,208,127,.15);
}

.qualityOkay{
  color:var(--yellow);
  background:rgba(245,196,81,.15);
}

.qualityBad{
  color:var(--red);
  background:rgba(255,92,103,.15);
}

.footer{
  text-align:center;
  margin-top:22px;
}

@media(max-width:520px){

  main{
    padding:14px 10px 40px;
  }

  .analysis{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .decisionGrid{
    grid-template-columns:1fr 1fr;
  }

  .decisionHeader{
    flex-direction:column;
  }

  .triggerStatus{
    align-self:flex-start;
  }

  .setup{
    font-size:18px;
  }
}
</style>
</head>

<body>

<main>

<header>
  <h1>Investment Cockpit</h1>
  <div class="small">
    Technical trend, candlestick &amp; decision analysis
  </div>
</header>

<div class="search">
  <input
    id="ticker"
    placeholder="Enter ticker e.g. NVDA"
    autocomplete="off"
    autocapitalize="characters"
  >
  <button onclick="addTicker()">Add</button>
</div>

<div id="status" class="small"></div>

<div class="card">
  <div class="chartTitle">
    <h2>My watchlist</h2>
  </div>

  <div id="watchlist" class="watchlist"></div>
</div>

<div id="dashboard"></div>

<div class="footer small">
  Market data provided through Alpha Vantage.
</div>

</main>

<script>

const STORAGE_KEY = "ic_watchlist";
const SELECTED_KEY = "ic_selected";

let list = JSON.parse(
  localStorage.getItem(STORAGE_KEY) ||
  '["NVDA","MSFT","GOOGL","AAPL","AMZN","TSLA"]'
);

let selected =
  localStorage.getItem(SELECTED_KEY) || list[0];


/* =========================
   HELPERS
========================= */

function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(list)
  );

  localStorage.setItem(
    SELECTED_KEY,
    selected
  );
}


function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}


function money(value){

  if(
    value == null ||
    !Number.isFinite(Number(value))
  ){
    return "—";
  }

  return "$" +
    Number(value).toLocaleString(
      "en-US",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );
}


function number(value){

  if(
    value == null ||
    !Number.isFinite(Number(value))
  ){
    return "—";
  }

  return Number(value).toFixed(2);
}


function pct(value){

  const n = Number(value);

  if(!Number.isFinite(n)){
    return "—";
  }

  return (
    n >= 0 ? "+" : ""
  ) +
  n.toFixed(2) +
  "%";
}


function trendClass(trend){

  if(trend === "BULLISH")
    return "bullish";

  if(trend === "BEARISH")
    return "bearish";

  return "sideways";
}


function setupClass(setup){

  const s = String(setup || "").toUpperCase();

  if(
    s.includes("BREAKOUT") ||
    s.includes("CONFIRMED BUY") ||
    s.includes("BUY")
  ){
    return "bullish";
  }

  if(
    s.includes("BREAKDOWN") ||
    s.includes("CONFIRMED SELL") ||
    s.includes("SELL")
  ){
    return "bearish";
  }

  return "sideways";
}


function qualityClass(quality){

  const q = String(
    quality || ""
  ).toUpperCase();

  if(q === "ATTRACTIVE")
    return "qualityGood";

  if(q === "ACCEPTABLE")
    return "qualityOkay";

  return "qualityBad";
}


/* =========================
   WATCHLIST
========================= */

function renderWatchlist(){

  const box =
    document.getElementById("watchlist");

  box.innerHTML =
    list.map(t => `

      <button
        class="tickerBtn"
        onclick="selectTicker('${esc(t)}')"
      >
        ${esc(t)}
      </button>

    `).join("");
}


function addTicker(){

  const input =
    document.getElementById("ticker");

  const ticker =
    input.value
      .trim()
      .toUpperCase();

  if(!/^[A-Z.]{1,8}$/.test(ticker)){

    setStatus(
      "Enter a valid US ticker."
    );

    return;
  }

  if(!list.includes(ticker)){

    list.unshift(ticker);

    list = list.slice(0,12);
  }

  selected = ticker;

  save();

  input.value = "";

  renderWatchlist();

  load();
}


function selectTicker(ticker){

  selected = ticker;

  save();

  load();
}


function setStatus(text){

  document.getElementById(
    "status"
  ).textContent = text;
}


/* =========================
   API
========================= */

async function api(ticker){

  const response =
    await fetch(
      "/api/stock?ticker=" +
      encodeURIComponent(ticker)
    );

  const data =
    await response.json();

  if(!response.ok){

    throw new Error(
      data.error ||
      "Unable to load stock"
    );
  }

  return data;
}


/* =========================
   CANVAS HELPERS
========================= */

function line(
  ctx,
  x1,
  y1,
  x2,
  y2
){

  ctx.beginPath();

  ctx.moveTo(x1,y1);

  ctx.lineTo(x2,y2);

  ctx.stroke();
}


/* =========================
   PRICE CHART
========================= */

function drawPriceChart(
  canvas,
  data
){

  const history =
    (data.history || [])
      .slice(-100);

  if(!history.length)
    return;

  const dpr =
    window.devicePixelRatio || 1;

  const width =
    canvas.clientWidth || 700;

  const height = 350;

  canvas.width =
    width * dpr;

  canvas.height =
    height * dpr;

  const ctx =
    canvas.getContext("2d");

  ctx.scale(dpr,dpr);

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  const pad = {
    left:48,
    right:12,
    top:18,
    bottom:28
  };

  const chartW =
    width -
    pad.left -
    pad.right;

  const chartH =
    height -
    pad.top -
    pad.bottom;

  const values = [];

  history.forEach(item => {

    if(Number.isFinite(Number(item.high)))
      values.push(Number(item.high));

    if(Number.isFinite(Number(item.low)))
      values.push(Number(item.low));

    if(Number.isFinite(Number(item.sma20)))
      values.push(Number(item.sma20));

    if(Number.isFinite(Number(item.sma50)))
      values.push(Number(item.sma50));

  });

  [
    data.target1,
    data.target2,
    data.stop,
    data.buy_trigger_price,
    data.price
  ].forEach(v => {

    if(Number.isFinite(Number(v)))
      values.push(Number(v));

  });

  if(!values.length)
    return;

  const min =
    Math.min(...values);

  const max =
    Math.max(...values);

  const range =
    max - min || 1;


  function x(i){

    if(history.length === 1)
      return pad.left + chartW/2;

    return pad.left +
      i/(history.length-1) *
      chartW;
  }


  function y(v){

    return pad.top +
      (max-v)/range *
      chartH;
  }


  ctx.font =
    "11px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif";


  /* GRID */

  ctx.strokeStyle =
    "#252b36";

  ctx.lineWidth = 1;

  for(let i=0;i<5;i++){

    const yy =
      pad.top +
      i/4 *
      chartH;

    line(
      ctx,
      pad.left,
      yy,
      width-pad.right,
      yy
    );

    const value =
      max -
      i/4 *
      range;

    ctx.fillStyle =
      "#8992a3";

    ctx.fillText(
      money(value),
      4,
      yy+4
    );
  }


  /* SMA */

  function drawSMA(
    key,
    dash
  ){

    ctx.beginPath();

    ctx.strokeStyle =
      key === "sma20"
        ? "#55a7ff"
        : "#a88cff";

    ctx.lineWidth = 1.7;

    ctx.setLineDash(
      dash ? [5,4] : []
    );

    let started = false;

    history.forEach(
      (item,i) => {

        if(item[key] == null)
          return;

        const xx = x(i);
        const yy = y(item[key]);

        if(!started){

          ctx.moveTo(
            xx,
            yy
          );

          started = true;

        }else{

          ctx.lineTo(
            xx,
            yy
          );
        }
      }
    );

    ctx.stroke();

    ctx.setLineDash([]);
  }


  drawSMA(
    "sma20",
    false
  );

  drawSMA(
    "sma50",
    true
  );


  /* HORIZONTAL LEVELS */

  function horizontal(
    value,
    label,
    type
  ){

    if(
      value == null ||
      !Number.isFinite(Number(value))
    ){
      return;
    }

    const yy =
      y(Number(value));

    if(type === "support")
      ctx.strokeStyle =
        "rgba(53,208,127,.65)";

    else if(type === "resistance")
      ctx.strokeStyle =
        "rgba(255,92,103,.65)";

    else if(type === "trigger")
      ctx.strokeStyle =
        "rgba(85,167,255,.85)";

    else if(type === "invalidation")
      ctx.strokeStyle =
        "rgba(255,92,103,.8)";

    else
      ctx.strokeStyle =
        "rgba(245,196,81,.65)";

    ctx.setLineDash(
      type === "trigger"
        ? [7,4]
        : [5,5]
    );

    line(
      ctx,
      pad.left,
      yy,
      width-pad.right,
      yy
    );

    ctx.setLineDash([]);

    ctx.fillStyle =
      ctx.strokeStyle;

    ctx.fillText(
      label,
      pad.left+5,
      yy-5
    );
  }


  horizontal(
    data.fundamentals?.support,
    "Support",
    "support"
  );

  horizontal(
    data.fundamentals?.resistance,
    "Resistance",
    "resistance"
  );

  horizontal(
    data.buy_trigger_price,
    "BUY TRIGGER",
    "trigger"
  );

  horizontal(
    data.target1,
    "Target 1",
    "target"
  );

  horizontal(
    data.target2,
    "Target 2",
    "target"
  );

  horizontal(
    data.invalidation ?? data.stop,
    "Invalidation",
    "invalidation"
  );


  /* CANDLESTICKS */

  const candleWidth =
    Math.max(
      2,
      Math.min(
        9,
        chartW /
        history.length *
        .62
      )
    );


  history.forEach(
    (item,i) => {

      const xx = x(i);

      const openY =
        y(Number(item.open));

      const closeY =
        y(Number(item.close));

      const highY =
        y(Number(item.high));

      const lowY =
        y(Number(item.low));

      const bullish =
        Number(item.close) >=
        Number(item.open);

      ctx.strokeStyle =
        bullish
          ? "#35d07f"
          : "#ff5c67";

      ctx.fillStyle =
        bullish
          ? "#35d07f"
          : "#ff5c67";

      ctx.lineWidth = 1;

      /* wick */

      line(
        ctx,
        xx,
        highY,
        xx,
        lowY
      );

      /* body */

      const top =
        Math.min(
          openY,
          closeY
        );

      const bodyH =
        Math.max(
          1,
          Math.abs(
            closeY-openY
          )
        );

      ctx.fillRect(
        xx-candleWidth/2,
        top,
        candleWidth,
        bodyH
      );
    }
  );


  /* CURRENT PRICE */

  const currentY =
    y(Number(data.price));

  ctx.strokeStyle =
    "#f2f4f7";

  ctx.setLineDash(
    [2,3]
  );

  line(
    ctx,
    pad.left,
    currentY,
    width-pad.right,
    currentY
  );

  ctx.setLineDash([]);

  ctx.fillStyle =
    "#f2f4f7";

  const currentLabelY =
    Math.max(
      14,
      Math.min(
        height-30,
        currentY-5
      )
    );

  ctx.fillText(
    "Current",
    Math.max(
      pad.left+5,
      width-55
    ),
    currentLabelY
  );


  /* DATES */

  ctx.fillStyle =
    "#8992a3";

  const first =
    history[0];

  const last =
    history[
      history.length-1
    ];

  ctx.fillText(
    first.date.slice(5),
    pad.left,
    height-8
  );

  ctx.fillText(
    last.date.slice(5),
    width-40,
    height-8
  );
}


/* =========================
   RSI
========================= */

function drawRSI(
  canvas,
  data
){

  const history =
    (data.history || [])
      .slice(-100);

  if(!history.length)
    return;

  const dpr =
    window.devicePixelRatio || 1;

  const width =
    canvas.clientWidth || 700;

  const height = 150;

  canvas.width =
    width*dpr;

  canvas.height =
    height*dpr;

  const ctx =
    canvas.getContext("2d");

  ctx.scale(dpr,dpr);

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  const left = 35;
  const right = 10;
  const top = 12;
  const bottom = 22;

  const w =
    width-left-right;

  const h =
    height-top-bottom;


  function x(i){

    if(history.length === 1)
      return left+w/2;

    return left+
      i/(history.length-1)*
      w;
  }


  function y(v){

    return top+
      (100-v)/100*
      h;
  }


  ctx.strokeStyle =
    "#252b36";

  ctx.lineWidth = 1;


  [30,50,70].forEach(
    value => {

      const yy =
        y(value);

      line(
        ctx,
        left,
        yy,
        width-right,
        yy
      );

      ctx.fillStyle =
        "#8992a3";

      ctx.font =
        "10px sans-serif";

      ctx.fillText(
        value,
        left-25,
        yy+3
      );
    }
  );


  ctx.beginPath();

  ctx.strokeStyle =
    "#55a7ff";

  ctx.lineWidth = 2;

  let started = false;


  history.forEach(
    (item,i) => {

      if(item.rsi == null)
        return;

      if(!started){

        ctx.moveTo(
          x(i),
          y(item.rsi)
        );

        started = true;

      }else{

        ctx.lineTo(
          x(i),
          y(item.rsi)
        );
      }
    }
  );

  ctx.stroke();

  ctx.fillStyle =
    "#8992a3";

/* =========================
   MACD
========================= */

function drawMACD(
  canvas,
  data
){

  const history =
    (data.history || [])
      .slice(-100);

  if(!history.length)
    return;

  const dpr =
    window.devicePixelRatio || 1;

  const width =
    canvas.clientWidth || 700;

  const height = 150;

  canvas.width =
    width*dpr;

  canvas.height =
    height*dpr;

  const ctx =
    canvas.getContext("2d");

  ctx.scale(dpr,dpr);

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  const left = 40;
  const right = 10;
  const top = 12;
  const bottom = 22;

  const w =
    width-left-right;

  const h =
    height-top-bottom;

  const vals = [];


  history.forEach(item => {

    if(item.macd != null)
      vals.push(
        Number(item.macd)
      );

    if(item.macdSignal != null)
      vals.push(
        Number(item.macdSignal)
      );

    if(item.macdHistogram != null)
      vals.push(
        Number(item.macdHistogram)
      );

  });


  if(!vals.length)
    return;


  const maxAbs =
    Math.max(
      ...vals.map(
        value =>
          Math.abs(value)
      )
    ) || 1;


  function x(i){

    if(history.length === 1)
      return left+w/2;

    return left+
      i/(history.length-1)*
      w;
  }


  function y(v){

    return top+
      (maxAbs-v)/
      (maxAbs*2)*
      h;
  }


  const zero =
    y(0);


  ctx.strokeStyle =
    "#252b36";

  line(
    ctx,
    left,
    zero,
    width-right,
    zero
  );


  const barW =
    Math.max(
      1,
      w/history.length*.65
    );


  history.forEach(
    (item,i) => {

      if(item.macdHistogram == null)
        return;

      const yy =
        y(item.macdHistogram);

      ctx.fillStyle =
        item.macdHistogram >= 0
          ? "rgba(53,208,127,.65)"
          : "rgba(255,92,103,.65)";

      ctx.fillRect(
        x(i)-barW/2,
        Math.min(
          yy,
          zero
        ),
        barW,
        Math.abs(
          zero-yy
        )
      );
    }
  );


  function draw(
    key,
    dash
  ){

    ctx.beginPath();

    ctx.strokeStyle =
      key === "macd"
        ? "#a88cff"
        : "#55a7ff";

    ctx.lineWidth = 1.7;

    ctx.setLineDash(
      dash ? [5,4] : []
    );

    let started = false;


    history.forEach(
      (item,i) => {

        if(item[key] == null)
          return;

        if(!started){

          ctx.moveTo(
            x(i),
            y(item[key])
          );

          started = true;

        }else{

          ctx.lineTo(
            x(i),
            y(item[key])
          );
        }
      }
    );

    ctx.stroke();

    ctx.setLineDash([]);
  }


  draw(
    "macd",
    false
  );

  draw(
    "macdSignal",
    true
  );


  ctx.fillStyle =
    "#8992a3";

  ctx.font =
    "10px sans-serif";

  ctx.fillText(
    "MACD",
    left,
    height-6
  );
}


/* =========================
   DECISION CONDITIONS
========================= */

function renderConditions(data){

  const conditions =
    Array.isArray(data.buy_conditions)
      ? data.buy_conditions
      : [];

  if(!conditions.length){

    return `
      <div class="small">
        No explicit confirmation conditions returned by the model.
      </div>
    `;
  }


  return conditions.map(
    condition => {

      const text =
        typeof condition === "string"
          ? condition
          : condition.text ||
            condition.label ||
            "Condition";

      const met =
        typeof condition === "string"
          ? true
          : Boolean(
              condition.met
            );

      const optional =
        typeof condition === "object" &&
        Boolean(condition.optional);


      let cls =
        met
          ? "conditionMet"
          : optional
            ? "conditionOptional"
            : "conditionMissing";


      let icon =
        met
          ? "✓"
          : optional
            ? "•"
            : "×";


      return `

        <div class="condition ${cls}">

          <div class="conditionIcon">
            ${icon}
          </div>

          <div>
            ${esc(text)}
          </div>

        </div>

      `;
    }
  ).join("");
}

      "Analysis updated for " +

    document.getElementById(
      "dashboard"
    ).innerHTML = `

      <div class="card">

        <strong>
          Unable to load

        </strong>

        <div class="small">

    );

}
